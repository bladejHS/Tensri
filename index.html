@import url('https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Azeret+Mono:wght@400;500;600;700;800&display=swap');
/* PROTOCOL ANTITEROR — fișă de evaluare
   Grafit rece, structură de oțel, ștampilă roșie. Tipografie condusă de monospace.
   Regula de culoare: roșu = sub standard, oțel = avansat, alb = nota 10. Nimic decorativ. */
:root{
  --void:#0A0A0C; --slab:#131417; --slab2:#0F1012; --slab3:#191B1F;
  --line:rgba(231,234,238,.11); --line2:rgba(231,234,238,.055);
  --bone:#E7EAEE; --mute:#8C919A; --mute2:#585D66;
  --steel:#AFB5BE; --tan:#C3CAD4;
  --accent:#7C8695; --accent-hi:#E9EEF4; --brass:#9AA3AE; --rust:#C0392B;
  --signal:var(--accent-hi); --hot:var(--rust); --ok:var(--accent-hi); --bad:var(--rust);
  --ink:var(--void); --panel:var(--slab); --panel2:var(--slab2); --txt:var(--bone);
  --dim:var(--mute); --dim2:var(--mute2); --amber:var(--tan); --amber-d:#9A9782;
  --grain:repeating-linear-gradient(0deg,rgba(231,234,238,.016) 0 1px,transparent 1px 3px);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--void)}
body{font-family:'Archivo',system-ui,sans-serif;color:var(--bone);-webkit-font-smoothing:antialiased;
  line-height:1.55;min-height:100vh;letter-spacing:-.003em}
h1,h2,h3{margin:0}
.mono{font-family:'Azeret Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.disp{font-family:'Azeret Mono',ui-monospace,monospace;font-weight:800;letter-spacing:-.045em}
.wrap{max-width:860px;margin:0 auto;padding:0 16px 96px}
:focus-visible{outline:2px solid var(--accent-hi);outline-offset:2px}
.hide{display:none!important}

/* bara de sus — antetul fișei */
.topbar{position:sticky;top:0;z-index:40;background:rgba(10,10,12,.94);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line)}
.topbar-in{max-width:860px;margin:0 auto;padding:11px 16px;display:flex;align-items:center;gap:12px}
.ttl{font-family:'Azeret Mono',monospace;font-weight:800;font-size:23px;line-height:.95;letter-spacing:-.06em}
.sub{font-family:'Azeret Mono';font-size:9px;color:var(--mute2);margin-top:5px;text-transform:uppercase;letter-spacing:.2em}
.pill{margin-left:auto;font-family:'Azeret Mono';font-size:9.5px;padding:6px 9px;border-radius:0;
  background:transparent;border:1px solid var(--accent);color:var(--tan);white-space:nowrap;
  font-weight:600;text-transform:uppercase;letter-spacing:.09em}
.pill b{font-weight:700;color:var(--bone)}

/* file */
.tabs{position:sticky;top:60px;z-index:30;background:var(--void);border-bottom:1px solid var(--line);
  overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs-in{max-width:860px;margin:0 auto;padding:7px 8px;display:flex;gap:2px}
.tab{appearance:none;background:none;border:none;border-bottom:2px solid transparent;color:var(--mute);
  cursor:pointer;font-family:'Azeret Mono';font-weight:500;padding:8px 11px 7px;font-size:11px;
  display:flex;align-items:center;gap:6px;white-space:nowrap;transition:.15s;letter-spacing:-.02em}
.tab:hover{color:var(--bone)}
.tab.on{color:var(--bone);border-bottom-color:var(--accent-hi)}
.tab svg{width:13px;height:13px;color:var(--mute2);transition:.15s}
.tab.on svg{color:var(--accent-hi)}

/* panou */
.panel{background:var(--slab);border:1px solid var(--line);border-radius:2px;padding:17px 17px 18px;margin-top:10px}
.panel-t{display:flex;align-items:center;gap:9px;font-family:'Azeret Mono';font-weight:600;font-size:13.5px;
  letter-spacing:-.025em;margin-bottom:11px;line-height:1.2;padding-bottom:10px;border-bottom:1px solid var(--line2)}
.panel-t svg{width:15px;height:15px;color:var(--accent-hi);flex:none}
.muted{color:var(--mute);font-size:13.5px;margin:0;line-height:1.6}
.hint{color:var(--mute2);font-size:11.5px;line-height:1.55}
.divider{height:1px;background:var(--line2);margin:16px 0}

/* antetul fișei (fostul creed) */
.creed{background:var(--slab2);border:1px solid var(--line);border-top:2px solid var(--accent);
  border-radius:2px;padding:16px 18px 14px;margin-top:10px;position:relative;overflow:hidden}
.creed:after{content:'';position:absolute;inset:0;pointer-events:none;background:var(--grain)}
.creed-t{font-family:'Azeret Mono';font-weight:500;font-size:14px;line-height:1.5;margin:0;
  color:var(--mute);position:relative;z-index:1;letter-spacing:-.03em}
.creed-t span{color:var(--tan);font-weight:700}
.creed-rule{display:none}
.creed-day{font-size:9.5px;color:var(--mute2);letter-spacing:.16em;margin-top:12px;padding-top:11px;
  border-top:1px solid var(--line2);position:relative;z-index:1;text-transform:uppercase}
@media(max-width:560px){.creed-t{font-size:13px}.creed-day{font-size:8.5px;letter-spacing:.1em}}

/* fișa de evaluare — rigla standardelor */
.hero{background:var(--slab);border:1px solid var(--line);border-radius:2px;padding:18px 17px;margin-top:10px}
.hero-top{display:flex;align-items:flex-start;gap:18px;flex-wrap:wrap}
.media-box{flex:none;min-width:104px}
.media-num{font-family:'Azeret Mono';font-weight:800;font-size:54px;line-height:.82;letter-spacing:-.06em;
  font-variant-numeric:tabular-nums}
.media-cap{font-family:'Azeret Mono';font-size:8.5px;color:var(--mute2);letter-spacing:.16em;
  margin-top:8px;text-transform:uppercase}
.hero-body{flex:1;min-width:210px}
.hero-body h1{font-family:'Azeret Mono';font-weight:700;font-size:19px;line-height:1.15;
  letter-spacing:-.045em;text-transform:uppercase;color:var(--bone)}
.verdict{display:inline-flex;align-items:center;gap:7px;font-family:'Azeret Mono';font-size:10px;font-weight:600;
  padding:5px 9px;margin-bottom:9px;letter-spacing:-.01em;border-radius:2px;border:1px solid transparent}
.verdict svg{width:12px;height:12px}
.v-ok{background:rgba(233,238,244,.14);border-color:var(--accent);color:var(--accent-hi)}
.v-mid{background:rgba(154,163,174,.13);border-color:rgba(154,163,174,.5);color:var(--brass)}
.v-bad{background:rgba(192,57,43,.15);border-color:rgba(192,57,43,.55);color:#E06A5C}
.v-none{background:rgba(231,234,238,.05);border-color:var(--line);color:var(--mute)}

/* riglă: o probă poziționată pe scara 1→10 */
.rulers{margin-top:20px;padding-top:4px}
.ruler{padding:13px 0;border-top:1px solid var(--line2)}
.ruler:first-child{border-top:none;padding-top:2px}
.ruler-h{display:flex;align-items:baseline;gap:10px;margin-bottom:9px}
.ruler-n{font-family:'Azeret Mono';font-weight:600;font-size:12px;letter-spacing:-.03em;color:var(--bone)}
.ruler-sub{font-family:'Azeret Mono';font-size:9.5px;color:var(--mute2);letter-spacing:-.01em}
.ruler-v{margin-left:auto;font-family:'Azeret Mono';font-weight:700;font-size:15px;letter-spacing:-.04em;
  font-variant-numeric:tabular-nums}
.ruler-note{font-family:'Azeret Mono';font-weight:700;font-size:11px;min-width:22px;text-align:right}
.rsvg{width:100%;height:auto;display:block;overflow:visible}
.rsvg .base{stroke:rgba(231,234,238,.16);stroke-width:1}
.rsvg .tick{stroke:rgba(231,234,238,.2);stroke-width:1}
.rsvg .tick.maj{stroke:rgba(231,234,238,.42)}
.rsvg .band{fill:rgba(154,163,174,.1)}
.rsvg .band10{fill:rgba(233,238,244,.16)}
.rsvg .lbl{fill:var(--mute2);font-size:7.5px;font-family:'Azeret Mono';letter-spacing:-.03em}
.rsvg .lbl.maj{fill:var(--mute)}
.rsvg .mk{stroke-width:2.4;stroke-linecap:round}
.rsvg .mkdot{stroke:none}

/* rânduri de probă */
.probe{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line2)}
.probe:last-child{border-bottom:none}
.probe-ic{width:28px;height:28px;border-radius:2px;background:rgba(124,134,149,.16);border:1px solid var(--line);
  color:var(--accent-hi);display:grid;place-items:center;flex:none}
.probe-ic svg{width:14px;height:14px}
.probe-name{font-family:'Azeret Mono';font-weight:600;font-size:12.5px;letter-spacing:-.03em}
.probe-meta{font-family:'Azeret Mono';font-size:10px;color:var(--mute2);margin-top:3px;letter-spacing:-.02em}
.probe-val{margin-left:auto;display:flex;align-items:center;gap:10px}
.probe-num{font-family:'Azeret Mono';font-weight:700;font-size:14px;letter-spacing:-.04em}
.nbadge{display:inline-block;min-width:28px;text-align:center;font-family:'Azeret Mono';font-weight:700;
  font-size:14px;padding:3px 6px;border-radius:2px;background:rgba(231,234,238,.06);letter-spacing:-.04em}

/* tabelul de standarde */
.tbl{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:10px}
.tbl th,.tbl td{padding:6px 8px;text-align:center;border-bottom:1px solid var(--line2)}
.tbl th{font-family:'Azeret Mono';color:var(--mute2);font-weight:500;font-size:9px;
  text-transform:uppercase;letter-spacing:.12em;border-bottom-color:var(--line)}
.tbl td:first-child,.tbl th:first-child{text-align:left}
.tbl td{font-family:'Azeret Mono';font-size:12px;letter-spacing:-.03em;color:var(--steel)}
.tbl tr.hl td{background:rgba(154,163,174,.07);color:var(--bone)}
.tbl tr.top td{background:rgba(233,238,244,.15);color:var(--bone);border-bottom-color:var(--accent)}
.tbl tr.top .n{color:var(--accent-hi)}
.tbl .n{font-weight:700;color:var(--bone)}
.scroll-x{overflow-x:auto}

/* acordeon */
.acc{border:1px solid var(--line);border-radius:2px;margin-top:8px;overflow:hidden;background:var(--slab)}
.acc.open{border-color:rgba(124,134,149,.45)}
.acc-h{width:100%;appearance:none;border:none;background:none;color:inherit;font-family:inherit;
  cursor:pointer;padding:14px 15px;display:flex;align-items:center;gap:13px;text-align:left}
.acc-num{font-family:'Azeret Mono';font-weight:700;font-size:13px;color:var(--mute);width:26px;height:26px;
  border-radius:2px;border:1px solid var(--line);background:var(--slab2);display:grid;place-items:center;
  flex:none;transition:.2s}
.acc.open .acc-num{background:var(--accent);color:var(--void);border-color:transparent}
.acc-ttl{font-family:'Azeret Mono';font-weight:700;font-size:14px;line-height:1.25;letter-spacing:-.04em}
.acc-wk{font-family:'Azeret Mono';font-size:9.5px;color:var(--tan);margin-top:5px;letter-spacing:-.02em;opacity:.8}
.acc-chev{margin-left:auto;color:var(--mute2);transition:transform .3s;width:17px;height:17px;flex:none}
.acc.open .acc-chev{transform:rotate(180deg);color:var(--accent-hi)}
.acc-body{max-height:0;overflow:hidden;transition:max-height .38s ease}
.acc.open .acc-body{max-height:2400px}
.acc-inner{padding:0 15px 15px 54px}
.wk{padding:11px 0;border-top:1px solid var(--line2)}
.wk-d{font-family:'Azeret Mono';font-weight:600;font-size:11.5px;letter-spacing:-.03em;color:var(--tan)}
.wk-p{font-size:13px;color:var(--mute);margin-top:5px;line-height:1.6}

/* câmpuri și butoane */
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-family:'Azeret Mono';font-size:9px;color:var(--mute2);text-transform:uppercase;letter-spacing:.13em}
.inp{background:var(--slab2);border:1px solid var(--line);border-radius:2px;color:var(--bone);
  font-family:'Azeret Mono';font-size:16px;padding:10px 11px;width:100%;outline:none;letter-spacing:-.03em;transition:.15s}
.inp:focus{border-color:var(--accent-hi);background:var(--slab3)}
.inp::placeholder{color:var(--mute2)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.btn{appearance:none;border:1px solid var(--line);background:transparent;color:var(--bone);
  font-family:'Azeret Mono';font-weight:600;font-size:11px;padding:10px 13px;border-radius:2px;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:.15s;letter-spacing:-.02em}
.btn:hover{border-color:var(--tan);color:#fff}
.btn.solid{background:var(--accent);color:#0A0A0C;border-color:transparent;font-weight:700}
.btn.solid:hover{background:var(--accent-hi);color:#0A0A0C}
.btn.ghost{border-color:transparent;color:var(--mute)}
.btn.ghost:hover{color:var(--tan)}
.btn svg{width:13px;height:13px}
.btn.sm{padding:6px 9px;font-size:10px}
.chip{appearance:none;border:1px solid var(--line);background:transparent;color:var(--mute);
  font-family:'Azeret Mono';font-weight:500;font-size:10.5px;padding:6px 10px;border-radius:2px;cursor:pointer;
  transition:.15s;letter-spacing:-.025em}
.chip:hover{color:var(--bone);border-color:var(--steel)}
.chip.on{background:var(--bone);color:var(--void);border-color:transparent;font-weight:700}
.chip.sm{padding:5px 8px;font-size:9.5px}
.chip.dl{border-color:rgba(154,163,174,.5);color:var(--brass)}
.chip.dl.on{background:var(--brass);color:var(--void);border-color:transparent}
.chips{display:flex;gap:6px;flex-wrap:wrap}

/* cronometru */
.ring-wrap{position:relative;width:224px;height:224px;margin:14px auto 2px}
.ring-wrap .inner{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.phase-tag{font-family:'Azeret Mono';font-size:9px;font-weight:700;letter-spacing:.26em;text-transform:uppercase}
.timer-num{font-family:'Azeret Mono';font-weight:800;font-size:52px;line-height:.9;margin:9px 0;letter-spacing:-.06em}

/* casete de cifre */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:13px}
.stat{background:var(--slab2);border:1px solid var(--line);border-radius:2px;padding:12px}
.stat .k{font-family:'Azeret Mono';font-size:8.5px;color:var(--mute2);text-transform:uppercase;letter-spacing:.14em}
.stat .v{font-family:'Azeret Mono';font-weight:800;font-size:24px;margin-top:8px;line-height:.9;letter-spacing:-.05em}
.stat .v small{font-family:'Azeret Mono';font-size:11px;color:var(--mute);font-weight:500;letter-spacing:-.02em}

/* metodă */
.method{border-left:2px solid var(--accent);padding:2px 0 2px 15px;margin-top:22px}
.method h3{font-family:'Azeret Mono';font-weight:700;font-size:15px;letter-spacing:-.04em;
  display:flex;align-items:center;gap:9px;line-height:1.3}
.method h3 svg{width:15px;height:15px;color:var(--accent-hi);flex:none}
.method p{font-size:13.5px;color:var(--mute);margin:10px 0 0;line-height:1.65}
.method .src{font-family:'Azeret Mono';font-size:9.5px;color:var(--mute2);margin-top:11px;letter-spacing:-.01em}
.klist{list-style:none;padding:0;margin:11px 0 0}
.klist li{font-size:13px;padding:5px 0 5px 17px;position:relative;color:var(--steel)}
.klist li:before{content:'';position:absolute;left:0;top:12px;width:7px;height:2px;background:var(--accent-hi)}

/* serii + casetă de atenție */
.sets{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.setpill{background:var(--slab2);border:1px solid var(--line);border-radius:2px;padding:8px 11px;
  font-family:'Azeret Mono';font-weight:700;font-size:13.5px;display:flex;align-items:center;gap:9px;letter-spacing:-.04em}
.setpill button{appearance:none;border:none;background:none;color:var(--mute2);cursor:pointer;
  display:grid;place-items:center;padding:0}
.setpill button:hover{color:var(--rust)}
.setpill svg{width:14px;height:14px}
.callout{background:var(--slab2);border:1px solid var(--line);border-left:2px solid var(--rust);
  border-radius:2px;padding:13px 15px;margin-top:13px;display:flex;gap:11px}
.callout svg{width:15px;height:15px;color:var(--rust);flex:none;margin-top:3px}
.callout .ct{font-size:12.5px;color:var(--mute);line-height:1.6}
.callout b{color:var(--bone);font-weight:600}
.callout.good{border-left-color:var(--accent)}
.callout.good svg{color:var(--accent-hi)}

/* poarta */
.gate{margin-top:14px;border:1px solid rgba(124,134,149,.4);border-left:2px solid var(--accent);
  background:var(--slab2);border-radius:2px;padding:14px}
.gate-h{display:flex;align-items:center;gap:8px;font-family:'Azeret Mono';font-size:11px;font-weight:600;
  letter-spacing:.08em;text-transform:uppercase;color:var(--tan)}
.gate-h svg{width:14px;height:14px;color:var(--accent-hi);flex:none}
.gate-ok{color:var(--accent-hi);font-weight:700}
.gate-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:7px;margin-top:12px}
.gate-i{border:1px solid var(--line2);border-radius:2px;padding:9px 10px;display:flex;flex-direction:column;gap:3px;
  background:var(--slab)}
.gate-i.ok{border-color:rgba(233,238,244,.45);background:rgba(233,238,244,.07)}
.gate-i.no{border-color:rgba(192,57,43,.4)}
.gate-i.soft{opacity:.6}
.gate-k{font-family:'Azeret Mono';font-size:9px;color:var(--mute2);letter-spacing:.11em;text-transform:uppercase}
.gate-v{font-size:16px;color:var(--bone);font-weight:700;letter-spacing:-.05em}
.gate-i.ok .gate-v{color:var(--accent-hi)}
.gate-i.no .gate-v{color:#E06A5C}
.gate-n{font-size:9.5px;color:var(--mute2);letter-spacing:-.02em}
.gate-act{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin-top:12px}

/* antrenament */
.today-band{background:var(--slab3);border:1px solid rgba(124,134,149,.45);border-left:2px solid var(--accent-hi);
  border-radius:2px;padding:14px 16px;margin-top:10px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.today-k{font-family:'Azeret Mono';font-size:8.5px;color:var(--accent-hi);letter-spacing:.2em;text-transform:uppercase}
.today-n{font-family:'Azeret Mono';font-weight:700;font-size:16px;letter-spacing:-.045em;margin-top:6px;line-height:1.2}
.today-m{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
.today-b{flex:1;min-width:180px}
.wprog{margin-top:15px}
.wprog-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;
  font-family:'Azeret Mono';font-size:9.5px;color:var(--mute2);margin-bottom:6px;letter-spacing:-.01em}
.wbar{height:2px;background:rgba(231,234,238,.08);overflow:hidden}
.wbar > i{display:block;height:100%;background:var(--accent-hi);transition:width .5s cubic-bezier(.2,.7,.2,1)}
.dgrid{display:grid;gap:7px;margin-top:10px}
.dcard{background:var(--slab);border:1px solid var(--line);border-radius:2px;overflow:hidden;transition:.2s}
.dcard.today{border-color:rgba(233,238,244,.55);background:var(--slab3)}
.dcard.is-rest{opacity:.45}
.dcard-h{width:100%;appearance:none;border:none;background:none;color:inherit;font-family:inherit;
  cursor:pointer;padding:14px 15px;display:flex;align-items:center;gap:13px;text-align:left}
.dring{width:28px;height:28px;flex:none}
.dring-t{fill:var(--mute2);font-size:11px;font-family:'Azeret Mono';font-weight:700}
.dcard-b{flex:1;min-width:0;display:block}
.dcard-lbl{display:flex;align-items:center;gap:8px;font-family:'Azeret Mono';font-size:9px;
  color:var(--mute2);letter-spacing:.14em;text-transform:uppercase;margin-bottom:6px}
.dcard-lbl em{font-style:normal;font-size:8px;font-weight:700;letter-spacing:.11em;
  background:var(--accent);color:var(--void);padding:3px 6px;border-radius:2px}
.dcard-lbl em.core{background:transparent;border:1px solid var(--accent);color:var(--accent-hi)}
.dcard-day{display:block;font-family:'Azeret Mono';font-weight:700;font-size:14.5px;line-height:1.25;letter-spacing:-.045em}
.dcard-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px}
.dcard-date{font-family:'Azeret Mono';font-size:9.5px;color:var(--mute2);letter-spacing:-.01em}
.dcard-body{max-height:0;overflow:hidden;transition:max-height .35s ease}
.dcard.open .dcard-body{max-height:2000px}
.ex-list{padding:0 15px 8px;border-top:1px solid var(--line2);margin-top:2px}
.ex-box{width:18px;height:18px;border-radius:2px;border:1.5px solid var(--line);background:var(--slab2);
  flex:none;display:grid;place-items:center;margin-top:1px;transition:.15s;color:var(--void)}
.ex-box svg{width:11px;height:11px;stroke-width:3.5}
.ex.on .ex-box{background:var(--accent-hi);border-color:transparent}
.ex-tick{flex:1;min-width:0;appearance:none;border:none;background:none;color:inherit;font-family:inherit;
  cursor:pointer;display:flex;align-items:flex-start;gap:11px;text-align:left;padding:0}
.ex-b{display:block;min-width:0}
.ex-n{display:block;font-family:'Azeret Mono';font-size:12px;font-weight:600;letter-spacing:-.035em;transition:.15s;line-height:1.35}
.ex.on .ex-n{color:var(--mute2);text-decoration:line-through}
.ex-d{display:block;font-size:11.5px;color:var(--mute);margin-top:5px;line-height:1.55}
.ex.on .ex-d{color:var(--mute2)}
.ex-rest{appearance:none;border:1px solid var(--line);background:transparent;color:var(--mute);
  font-family:'Azeret Mono';font-size:9.5px;font-weight:600;padding:6px 8px;border-radius:2px;
  cursor:pointer;flex:none;display:inline-flex;align-items:center;gap:5px;transition:.15s;margin-top:1px;letter-spacing:-.02em}
.ex-rest:hover{border-color:var(--accent-hi);color:var(--accent-hi)}
.ex-rest svg{width:11px;height:11px}
.ex-rest.live{background:var(--accent);color:var(--void);border-color:transparent}
.sess-bar{display:flex;align-items:center;gap:10px;padding:12px 0 4px;flex-wrap:wrap}
.wtag{display:inline-block;font-family:'Azeret Mono';font-size:9px;font-weight:700;padding:3px 7px;
  border-radius:2px;white-space:nowrap;text-transform:uppercase;letter-spacing:.09em;border:1px solid transparent}
.wtag.hard{background:rgba(192,57,43,.18);border-color:rgba(192,57,43,.6);color:#E06A5C}
.wtag.easy{background:rgba(184,181,164,.1);border-color:var(--line);color:var(--steel)}
.wtag.power{background:rgba(154,163,174,.16);border-color:rgba(154,163,174,.55);color:var(--brass)}
.wtag.cal{background:rgba(233,238,244,.15);border-color:rgba(124,134,149,.6);color:var(--accent-hi)}
.wtag.rest{background:rgba(231,234,238,.05);border-color:var(--line2);color:var(--mute2)}
.wfoot{font-size:12.5px;color:var(--mute);line-height:1.75}
.wfoot b{color:var(--tan);font-weight:600}

/* jurnal de serii */
.ex{display:block;padding:12px 0;border-bottom:1px solid var(--line2)}
.ex:last-child{border-bottom:none}
.ex-main{display:flex;align-items:flex-start;gap:10px}
.setlog{margin:12px 0 2px 29px;padding:12px;background:var(--slab2);border:1px solid var(--line);border-radius:2px}
.sugg{font-size:12px;color:var(--bone);display:flex;align-items:flex-start;gap:7px;line-height:1.5;
  padding:9px 10px;background:rgba(154,163,174,.1);border-left:2px solid var(--brass);margin-bottom:10px}
.sugg svg{width:13px;height:13px;color:var(--brass);flex:none;margin-top:2px}
.sugg b{font-family:'Azeret Mono';font-weight:700;letter-spacing:-.02em;font-size:10.5px}
.sugg.up{background:rgba(233,238,244,.12);border-left-color:var(--accent-hi)}
.sugg.up svg{color:var(--accent-hi)}
.sugg.down{background:rgba(192,57,43,.12);border-left-color:var(--rust)}
.sugg.down svg{color:#E06A5C}
.prevline{font-size:10px;color:var(--mute2);margin-bottom:10px;letter-spacing:-.02em}
.prevline .wnow{background:var(--accent);color:var(--void);padding:2px 6px;border-radius:2px;font-weight:700}
.setrow{display:grid;grid-template-columns:20px 1fr 1fr 56px 32px;gap:6px;align-items:center;margin-bottom:6px}
.setn{font-size:10px;color:var(--mute2);text-align:center}
.setcell{padding:8px;font-size:14px;text-align:center}
.sete{font-size:9px;color:var(--mute2);text-align:right;letter-spacing:-.02em}
.setadd{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:8px}
.ex-last{display:block;font-size:10.5px;color:var(--bone);margin-top:4px;letter-spacing:-.02em}
.ex-last b{color:var(--accent-hi)}
.lastw{font-size:12px;color:var(--bone);margin-bottom:8px}
.lastw b{font-family:'Azeret Mono';font-size:14px;color:var(--accent-hi)}
.cntbox{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:2px 0 10px 34px;padding:10px 12px;
  border:1px solid var(--line2);border-radius:6px;background:rgba(185,201,217,.04)}
.cntbox .cl{font-size:11px;color:var(--mute);letter-spacing:.04em;text-transform:uppercase;margin-right:auto}
.cntbox .cbtn{width:40px;height:40px;font-size:20px;line-height:1;padding:0;justify-content:center}
.cntbox .cinp{width:64px;text-align:center;font-size:18px;padding:8px 4px}
.cntbox .cprev{flex-basis:100%;font-size:10.5px;color:var(--mute2)}

/* nutriție */
.mrow{margin-top:12px}
.mrow-h{display:flex;justify-content:space-between;font-family:'Azeret Mono';font-size:10px;
  color:var(--mute2);margin-bottom:5px;letter-spacing:-.01em}
.mrow-h .over{color:var(--rust)}
.mbar{height:3px;background:rgba(231,234,238,.07);overflow:hidden}
.mbar > i{display:block;height:100%;transition:width .5s cubic-bezier(.2,.7,.2,1)}
.rest-line{font-size:13px;color:var(--mute);margin-top:14px;padding-top:12px;border-top:1px solid var(--line2)}
.rest-line b{color:var(--tan)}
.lrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line2)}
.lrow:last-of-type{border-bottom:none}
.lrow-b{flex:1;min-width:0}
.lrow-n{font-family:'Azeret Mono';font-size:12px;font-weight:600;letter-spacing:-.035em}
.lrow-m{font-family:'Azeret Mono';font-size:10px;color:var(--mute2);margin-top:4px;letter-spacing:-.02em}
.cust{display:grid;grid-template-columns:1fr 62px 48px 48px 48px auto;gap:6px}
.cust .inp{font-size:13px;padding:9px 8px}
.add-btn{appearance:none;border:1px solid var(--line);background:transparent;color:var(--mute);
  width:27px;height:27px;border-radius:2px;cursor:pointer;display:grid;place-items:center;flex:none;transition:.15s}
.add-btn:hover{background:var(--accent);color:var(--void);border-color:transparent}
.add-btn svg{width:14px;height:14px}
.slot{background:var(--slab);border:1px solid var(--line);border-radius:2px;margin-top:7px;overflow:hidden}
.slot.open{border-color:rgba(124,134,149,.4)}
.slot-h{width:100%;appearance:none;border:none;background:none;color:inherit;font-family:inherit;
  cursor:pointer;padding:14px 15px;display:flex;align-items:center;gap:12px;text-align:left}
.slot-n{font-family:'Azeret Mono';font-weight:700;font-size:13.5px;flex:1;line-height:1.2;letter-spacing:-.04em}
.slot-t{font-family:'Azeret Mono';font-size:10px;color:var(--tan);letter-spacing:-.02em}
.slot-b{max-height:0;overflow:hidden;transition:max-height .4s ease}
.slot.open .slot-b{max-height:4000px;overflow-y:auto}
.slot-in{padding:0 15px 14px;border-top:1px solid var(--line2)}
.meal{padding:12px 0;border-bottom:1px solid var(--line2)}
.meal:last-child{border-bottom:none}
.meal-h{display:flex;align-items:center;gap:10px}
.meal-n{font-size:12.5px;font-weight:600;flex:1;line-height:1.35}
.meal-k{font-family:'Azeret Mono';font-size:11.5px;font-weight:700;letter-spacing:-.04em}
.meal-m{font-family:'Azeret Mono';font-size:10px;color:var(--accent-hi);margin-top:5px;letter-spacing:-.01em}
.meal-i{font-size:11px;color:var(--mute2);margin-top:5px;line-height:1.6}

/* suplimente */
.sup{padding:14px 0;border-bottom:1px solid var(--line2)}
.sup:last-child{border-bottom:none;padding-bottom:2px}
.sup.off{opacity:.55}
.sup-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.sup-n{font-family:'Azeret Mono';font-weight:700;font-size:13.5px;letter-spacing:-.04em}
.sup-d{margin-left:auto;font-size:10.5px;color:var(--tan);letter-spacing:-.02em;white-space:nowrap}
.sup-p{font-size:13px;color:var(--mute);line-height:1.65;margin:8px 0 0}
.sup .klist{margin-top:9px}
.sup .klist li{font-size:12.5px}

/* jurnal */
.wo-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:13px}
.wo-btn{appearance:none;border:1px solid var(--line);background:var(--slab2);color:var(--bone);
  font-family:'Azeret Mono';font-size:11px;font-weight:600;padding:13px 12px;border-radius:2px;cursor:pointer;
  display:flex;align-items:center;gap:10px;text-align:left;transition:.15s;letter-spacing:-.03em}
.wo-btn:hover{background:var(--accent);color:var(--void);border-color:transparent}
.wo-btn:hover svg{color:var(--void)}
.wo-btn:active{transform:scale(.98)}
.wo-btn svg{width:15px;height:15px;color:var(--accent-hi);flex:none;transition:.15s}
.strip{display:flex;gap:5px;margin-top:15px}
.strip .day{flex:1;text-align:center}
.strip .dot{width:100%;aspect-ratio:1;max-width:36px;margin:0 auto 6px;border-radius:2px;
  background:var(--slab2);border:1px solid var(--line);display:grid;place-items:center;color:var(--mute2)}
.strip .dot.on{background:var(--accent);border-color:transparent;color:var(--void)}
.strip .dot svg{width:14px;height:14px}
.strip .dl{font-family:'Azeret Mono';font-size:8.5px;color:var(--mute2);letter-spacing:.06em;text-transform:uppercase}
.entry{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--line2)}
.entry:last-child{border-bottom:none}
.entry-ic{width:27px;height:27px;border-radius:2px;background:var(--slab2);border:1px solid var(--line);
  display:grid;place-items:center;color:var(--accent-hi);flex:none}
.entry-ic svg{width:13px;height:13px}
.entry-b{flex:1;min-width:0}
.entry-t{font-family:'Azeret Mono';font-size:11.5px;font-weight:600;letter-spacing:-.035em}
.entry-note{background:none;border:none;border-bottom:1px solid var(--line);color:var(--mute);
  font-size:11.5px;padding:5px 0;width:100%;outline:none;margin-top:5px;font-family:'Archivo'}
.entry-note:focus{border-bottom-color:var(--accent-hi);color:var(--bone)}
.entry-note::placeholder{color:var(--mute2)}
.daygroup{margin-top:16px}
.daygroup-h{font-family:'Azeret Mono';font-size:9.5px;color:var(--mute2);margin-bottom:4px;letter-spacing:.12em;text-transform:uppercase}

/* grafic */
.chart{width:100%;height:auto;display:block;margin-top:13px}
.chart .grid{stroke:rgba(231,234,238,.05);stroke-width:1}
.chart .axis{fill:#8C919A;font-size:9px;font-family:'Azeret Mono'}
.chart .tline{stroke:var(--mute);stroke-width:1.2;stroke-dasharray:3 4}
.chart .tlabel{fill:var(--mute);font-size:9px;font-family:'Azeret Mono'}
.chart .path{fill:none;stroke:var(--bone);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .pt{fill:var(--bone)}

/* bara de jos */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--slab3);color:var(--bone);
  border-top:2px solid var(--accent);animation:dockUp .3s cubic-bezier(.2,.8,.2,1)}
@keyframes dockUp{from{transform:translateY(100%)}to{transform:none}}
.dock-in{max-width:860px;margin:0 auto;padding:11px 16px calc(11px + env(safe-area-inset-bottom));
  display:flex;align-items:center;gap:14px}
.dock-blk{display:flex;align-items:center;gap:10px;min-width:0}
.dock-blk svg{color:var(--accent-hi)}
.dock-ring{width:34px;height:34px;flex:none}
.dock-k{font-family:'Azeret Mono';font-size:8px;color:var(--mute2);letter-spacing:.16em;text-transform:uppercase}
.dock-v{font-family:'Azeret Mono';font-weight:800;font-size:22px;line-height:1;letter-spacing:-.06em}
.dock-v.rest{color:var(--brass)}
.dock-sep{width:1px;align-self:stretch;background:var(--line)}
.dock-acts{margin-left:auto;display:flex;gap:7px;flex:none}
body.has-dock .wrap{padding-bottom:150px}

/* editorul de plan + graficul de volum */
.inp.mini{padding:8px 6px;text-align:center;font-size:14px;min-width:54px}
.tbl.plan td{padding:6px 5px;vertical-align:middle}
.tbl.plan td.pn{white-space:nowrap;color:var(--bone);font-weight:600}
.tbl.plan td.pm{color:var(--mute2);text-align:center}
.volbars{display:flex;align-items:flex-end;gap:6px;overflow-x:auto;padding-bottom:4px}
.vb{flex:1;min-width:34px;display:flex;flex-direction:column;align-items:center;gap:6px}
.vb-t{width:100%;background:linear-gradient(180deg,rgba(233,238,244,.85),rgba(233,238,244,.35));
  border-radius:2px 2px 0 0;align-self:flex-end}
.vb-k{font-size:10px;color:var(--steel)}
.vb-d{font-size:9px;color:var(--mute2);letter-spacing:-.02em}
.callout.ok{border-color:rgba(122,168,116,.4)}
.callout.bad{border-color:rgba(192,57,43,.5)}

/* ---------- animații (doar la schimbarea filei, ca să nu se repete la fiecare bifă) ---------- */
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes popIn{from{opacity:0;transform:scale(.93)}to{opacity:1;transform:none}}
@keyframes slideL{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}
@keyframes barIn{from{transform:scaleX(0)}to{transform:none}}
@keyframes drawLine{to{stroke-dashoffset:0}}
@keyframes mkIn{from{opacity:0;transform:translateX(-46px)}to{opacity:1;transform:none}}
@keyframes rowFlash{0%{background:rgba(233,238,244,.14)}100%{background:transparent}}
@keyframes tickPop{0%{transform:scale(.6)}62%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(233,238,244,0)}50%{box-shadow:0 0 0 4px rgba(233,238,244,.07)}}

#view.anim .fade > *{animation:rise .46s cubic-bezier(.2,.85,.25,1) both}
#view.anim .fade > *:nth-child(1){animation-delay:.02s}
#view.anim .fade > *:nth-child(2){animation-delay:.07s}
#view.anim .fade > *:nth-child(3){animation-delay:.12s}
#view.anim .fade > *:nth-child(4){animation-delay:.17s}
#view.anim .fade > *:nth-child(5){animation-delay:.22s}
#view.anim .fade > *:nth-child(6){animation-delay:.27s}
#view.anim .fade > *:nth-child(n+7){animation-delay:.32s}

#view.anim .dgrid > *{animation:rise .42s cubic-bezier(.2,.85,.25,1) both}
#view.anim .dgrid > *:nth-child(1){animation-delay:.10s}
#view.anim .dgrid > *:nth-child(2){animation-delay:.15s}
#view.anim .dgrid > *:nth-child(3){animation-delay:.20s}
#view.anim .dgrid > *:nth-child(4){animation-delay:.25s}
#view.anim .dgrid > *:nth-child(5){animation-delay:.30s}
#view.anim .dgrid > *:nth-child(6){animation-delay:.35s}
#view.anim .dgrid > *:nth-child(n+7){animation-delay:.40s}

#view.anim .ruler{animation:slideL .5s cubic-bezier(.2,.85,.25,1) both}
#view.anim .ruler:nth-child(2){animation-delay:.09s}
#view.anim .ruler:nth-child(3){animation-delay:.18s}
#view.anim .stats .stat,#view.anim .gate-grid .gate-i{animation:popIn .44s cubic-bezier(.2,.95,.3,1) both}
#view.anim .stats .stat:nth-child(2),#view.anim .gate-grid .gate-i:nth-child(2){animation-delay:.06s}
#view.anim .stats .stat:nth-child(3),#view.anim .gate-grid .gate-i:nth-child(3){animation-delay:.12s}
#view.anim .stats .stat:nth-child(4),#view.anim .gate-grid .gate-i:nth-child(4){animation-delay:.18s}
#view.anim .acc,#view.anim .sup,#view.anim .method{animation:rise .44s cubic-bezier(.2,.85,.25,1) both}
#view.anim .acc:nth-child(2),#view.anim .sup:nth-child(2){animation-delay:.05s}
#view.anim .acc:nth-child(3),#view.anim .sup:nth-child(3){animation-delay:.10s}
#view.anim .acc:nth-child(4),#view.anim .sup:nth-child(4){animation-delay:.15s}
#view.anim .acc:nth-child(n+5),#view.anim .sup:nth-child(n+5){animation-delay:.20s}
#view.anim .today-band{animation:rise .5s cubic-bezier(.2,.9,.25,1) both, glow 2.4s ease 1s 2}

.rsvg .mkg{animation:mkIn .62s cubic-bezier(.2,.9,.25,1) .2s both}
.wbar > i,.mbar > i{transform-origin:left center;animation:barIn .85s cubic-bezier(.2,.85,.2,1) .15s both}
.chart .path{stroke-dasharray:1;stroke-dashoffset:1;animation:drawLine 1.15s cubic-bezier(.4,0,.2,1) .2s forwards}
.chart .pt{animation:popIn .3s ease both}
.chart .pt:nth-of-type(2){animation-delay:.5s}.chart .pt:nth-of-type(3){animation-delay:.65s}
.chart .pt:nth-of-type(4){animation-delay:.8s}.chart .pt:nth-of-type(n+5){animation-delay:.95s}

/* feedback la bifă — doar pe rândul atins */
.ex.just{animation:rowFlash .55s ease}
.ex.just .ex-box{animation:tickPop .34s cubic-bezier(.3,1.5,.4,1)}

/* apăsare */
.btn:active,.chip:active,.wo-btn:active,.add-btn:active{transform:scale(.955)}
.dcard-h:active,.acc-h:active,.slot-h:active{opacity:.75}
.btn,.chip,.wo-btn,.add-btn{transition:transform .12s cubic-bezier(.3,1.4,.4,1),background .15s,color .15s,border-color .15s}
.dcard{transition:border-color .25s,background .25s,transform .2s}
.dcard.today{animation:glow 3s ease infinite}
.tab{transition:color .18s,border-color .25s}
.tab.on svg{animation:popIn .3s cubic-bezier(.3,1.4,.4,1)}
.nbadge.count{animation:popIn .34s cubic-bezier(.3,1.5,.4,1)}

/* ---------- încălzire ---------- */
.wu{margin-bottom:12px;padding:10px 12px;border:1px dashed var(--line2);border-radius:4px}
.wu-h{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute2);margin-bottom:8px;display:flex;justify-content:space-between}
.wu-row{display:flex;gap:6px;flex-wrap:wrap}
.wu-p{appearance:none;border:1px solid var(--line);background:var(--slab2);color:var(--bone);border-radius:20px;
  padding:6px 11px;font:600 12px 'Azeret Mono',monospace;letter-spacing:-.02em;cursor:pointer;
  transition:transform .15s cubic-bezier(.3,1.5,.4,1),background .2s,color .2s,border-color .2s}
.wu-p.on{background:var(--accent-hi);color:var(--void);border-color:transparent}
.wu-p.on::before{content:'✓ '}
.wu-p:active{transform:scale(.9)}
.wu.done{opacity:.55}
.wu-note{font-size:11px;color:var(--mute2)}

/* ---------- forță pe exercițiu ---------- */
.lchips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.lchips::-webkit-scrollbar{display:none}
.lchips .chip{white-space:nowrap;flex:none}
.chip svg{width:13px;height:13px;vertical-align:-2px;margin-right:2px}
.prb{display:inline-block;font:700 9px 'Azeret Mono',monospace;letter-spacing:.08em;padding:2px 6px;border-radius:2px;
  background:var(--rust);color:#fff;vertical-align:middle}
.sete.pr{color:#fff}
.sete.pr b{background:var(--rust);padding:1px 4px;border-radius:2px;margin-right:3px}

/* ---------- toast de record ---------- */
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));z-index:120;transform:translateX(-50%);
  background:var(--slab3);border:1px solid rgba(192,57,43,.6);border-left:3px solid var(--rust);color:var(--bone);
  padding:12px 16px 12px 14px;min-width:260px;max-width:92vw;border-radius:4px;box-shadow:0 18px 50px rgba(0,0,0,.55);
  animation:toastIn .55s cubic-bezier(.2,1.3,.35,1) both, toastOut .45s ease 3.1s forwards;pointer-events:none}
.toast-k{font:700 10px 'Azeret Mono',monospace;letter-spacing:.14em;color:#E06A5C}
.toast-v{font-size:15px;font-weight:700;margin-top:3px}
.toast-s{font-size:12px;color:var(--mute);margin-top:2px}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,-140%) scale(.9)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes toastOut{to{opacity:0;transform:translate(-50%,-60%) scale(.96)}}
.burst{position:fixed;z-index:119;pointer-events:none;width:0;height:0}
.burst i{position:absolute;left:0;top:0;width:7px;height:7px;border-radius:1px;background:var(--c,#E9EEF4);
  animation:burst var(--t,.9s) cubic-bezier(.15,.7,.3,1) forwards}
@keyframes burst{0%{transform:translate(0,0) rotate(0) scale(1);opacity:1}
  100%{transform:translate(var(--x),var(--y)) rotate(var(--r)) scale(.4);opacity:0}}
.flash{position:fixed;inset:0;z-index:118;pointer-events:none;background:var(--accent-hi);animation:flash .7s ease forwards}
@keyframes flash{0%{opacity:.16}100%{opacity:0}}

/* ---------- 1 · bara de jos + foaia „Mai mult" ---------- */
.tabs{display:none}
.wrap{padding-bottom:calc(128px + env(safe-area-inset-bottom))}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:65;background:rgba(15,16,18,.95);backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.bnav-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.bn{appearance:none;background:none;border:none;color:var(--mute2);font:600 10px 'Azeret Mono',monospace;letter-spacing:-.02em;
  display:flex;flex-direction:column;align-items:center;gap:5px;padding:9px 2px 8px;min-height:58px;cursor:pointer;position:relative;
  transition:color .2s}
.bn svg{width:22px;height:22px;transition:transform .25s cubic-bezier(.3,1.5,.4,1)}
.bn.on{color:var(--bone)}
.bn.on svg{color:var(--rust);transform:translateY(-1px) scale(1.08)}
.bn.on::before{content:'';position:absolute;top:0;left:28%;right:28%;height:2px;background:var(--rust);border-radius:0 0 2px 2px;
  animation:tabLine .35s cubic-bezier(.2,.9,.25,1)}
.bn:active svg{transform:scale(.86)}
.dock{bottom:calc(58px + env(safe-area-inset-bottom))}
.dock-in{padding-bottom:11px}
.sheet-bg{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.55);animation:fadeIn .25s ease both}
.sheet-bg.out{animation:fadeOut .22s ease forwards}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:81;background:var(--slab3);border-top:1px solid var(--line);
  border-radius:16px 16px 0 0;padding:10px 16px calc(22px + env(safe-area-inset-bottom));animation:fxUp .34s cubic-bezier(.2,.9,.25,1) both}
.sheet.out{animation:fxDown .24s ease forwards}
.sheet-grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 14px}
.sheet-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:560px;margin:0 auto}
.sheet-b{appearance:none;border:1px solid var(--line);background:var(--slab);color:var(--bone);border-radius:10px;
  padding:16px 6px;display:flex;flex-direction:column;align-items:center;gap:9px;font:600 11px 'Azeret Mono',monospace;cursor:pointer;
  animation:popIn .35s cubic-bezier(.3,1.4,.4,1) both;animation-delay:calc(var(--i) * 40ms + .08s)}
.sheet-b svg{width:22px;height:22px;color:var(--mute)}
.sheet-b.on{border-color:var(--rust)}
.sheet-b.on svg{color:var(--rust)}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeOut{to{opacity:0}}

/* ---------- 6 · roșu pentru acțiunea principală ---------- */
.btn.solid{background:var(--rust);color:#fff;border-color:var(--rust)}
.btn.solid:hover{background:#D5452F;color:#fff;border-color:#D5452F}
.today-band{border-left-color:var(--rust)}

/* ---------- 7 · antetul se strânge la derulare ---------- */
.topbar-in,.ttl,.topbar svg{transition:padding .25s ease,font-size .25s ease,width .25s ease,height .25s ease}
.sub{transition:opacity .2s,max-height .25s;max-height:20px;overflow:hidden}
body.scrolled .topbar-in{padding:6px 16px}
body.scrolled .ttl{font-size:17px}
body.scrolled .topbar svg{width:26px;height:26px}
body.scrolled .sub{opacity:0;max-height:0;margin-top:0}

/* ---------- 4 · ținte mari pentru degete ---------- */
.ex{padding:14px 0}
.ex-box{width:26px;height:26px;border-radius:5px;border-width:2px;margin-top:0}
.ex-box svg{width:15px;height:15px}
.ex-n{font-size:13px}
.ex-rest{min-height:40px;min-width:44px;justify-content:center;padding:8px 10px;font-size:10.5px}
.ex-rest svg{width:13px;height:13px}
.btn.sm{min-height:38px;padding:8px 12px;font-size:10.5px}
.chip{min-height:36px}
.dcard-h{min-height:64px}

/* ---------- 3 · „De ce?" ---------- */
details.why{margin-top:8px}
details.why > summary{list-style:none;cursor:pointer;color:var(--mute);font-size:13px;line-height:1.5;display:flex;gap:8px;align-items:flex-start}
details.why > summary::-webkit-details-marker{display:none}
details.why > summary::after{content:'De ce?';flex:none;margin-left:auto;font:600 10px 'Azeret Mono',monospace;letter-spacing:.06em;
  color:var(--bone);border:1px solid var(--line);border-radius:20px;padding:3px 9px;white-space:nowrap}
details.why[open] > summary::after{content:'Ascunde'}
details.why[open] > summary .wh{display:none}
details.why[open] > *:not(summary){animation:rise .3s ease both}

/* ---------- 2 · ecranul Azi ---------- */
.az-date{font:600 11px 'Azeret Mono',monospace;letter-spacing:.14em;color:var(--mute2);text-transform:uppercase;margin:14px 0 4px}
.az-h{font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.az-next{margin-top:14px;padding:18px;border:1px solid var(--line);border-left:3px solid var(--rust);border-radius:6px;
  background:linear-gradient(135deg,var(--slab3),var(--slab))}
.az-k{font:600 10px 'Azeret Mono',monospace;letter-spacing:.14em;color:var(--mute2);text-transform:uppercase}
.az-t{font-size:24px;font-weight:800;margin:6px 0 4px;letter-spacing:-.02em}
.az-m{font:500 12px 'Azeret Mono',monospace;color:var(--mute)}
.az-go{width:100%;min-height:58px;font-size:15px;margin-top:14px}
.az-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.az-card{background:var(--slab);border:1px solid var(--line);border-radius:6px;padding:14px;position:relative;overflow:hidden}
.az-card .az-k{margin-bottom:8px}
.az-week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:10px}
.az-d{appearance:none;background:none;border:none;color:var(--mute2);display:flex;flex-direction:column;align-items:center;gap:6px;
  font:600 10px 'Azeret Mono',monospace;cursor:pointer;padding:4px 0}
.az-d svg{width:34px;height:34px}
.az-d.next{color:var(--bone)}
.az-rings{display:flex;flex-direction:column;align-items:flex-start;gap:10px}
.az-rings svg{width:76px;height:76px;flex:none}
.az-rings .l{font:500 11px 'Azeret Mono',monospace;color:var(--mute);line-height:1.7;white-space:nowrap}
.az-rings .l b{color:var(--bone);font-size:14px}
.az-big{font:800 30px 'Azeret Mono',monospace;letter-spacing:-.04em}
.az-big small{font-size:13px;color:var(--mute);margin-left:3px}
.az-wrow{display:flex;gap:8px;margin-top:10px}
.az-wrow .inp{min-width:0}
.az-pr{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--line2);font-size:13px}
.az-pr:last-child{border-bottom:none}
.az-pr span:last-child{font-family:'Azeret Mono';color:var(--mute)}
#view.anim .az-next,#view.anim .az-card{animation:rise .45s cubic-bezier(.2,.85,.25,1) both}
#view.anim .az-row:nth-of-type(1) .az-card{animation-delay:.08s}
#view.anim .az-d{animation:popIn .4s cubic-bezier(.3,1.4,.4,1) both;animation-delay:calc(var(--i) * 45ms + .15s)}
@keyframes ringFill{from{stroke-dashoffset:var(--c)}}
#view.anim .az-ring{animation:ringFill 1.1s cubic-bezier(.2,.85,.25,1) .25s both}

/* ---------- predicție, stagnare, pantofi, compoziție ---------- */
.pj{width:100%;height:auto;display:block;margin-top:8px}
.pj .g{stroke:rgba(185,201,217,.08)}
.pj .ax{fill:var(--mute2);font:18px 'Azeret Mono',monospace}
.pj .band{fill:rgba(233,238,244,.07)}
.pj .mid{fill:none;stroke:var(--accent-hi);stroke-width:4;stroke-dasharray:1;stroke-dashoffset:1;animation:drawLine 1.3s cubic-bezier(.4,0,.2,1) .2s forwards}
.pj .tg{stroke:var(--rust);stroke-width:2.4;stroke-dasharray:8 8}
.pj .tgl{fill:#E06A5C;font:700 17px 'Azeret Mono',monospace}
.pj .pt{fill:var(--rust);stroke:var(--void);stroke-width:2}
.pj .hit{fill:var(--rust)}
.pdate{font:800 26px 'Azeret Mono',monospace;letter-spacing:-.03em}
.pdate small{font-size:12px;color:var(--mute);margin-left:6px;font-weight:600}
.stall{border-left:3px solid var(--rust);padding:10px 12px;background:rgba(192,57,43,.07);margin-top:10px;border-radius:0 4px 4px 0;
  animation:rise .4s ease both}
.stall b{font-size:14px}
.stall .m{font:500 11.5px 'Azeret Mono',monospace;color:var(--mute);margin-top:3px}
.stall ul{margin:8px 0 0;padding-left:18px;font-size:12.5px;color:var(--bone);line-height:1.55}
.shoe{padding:12px 0;border-bottom:1px solid var(--line2)}
.shoe:last-of-type{border-bottom:none}
.shoe-h{display:flex;align-items:baseline;gap:8px}
.shoe-h b{font-size:14px}
.shoe-h .km{margin-left:auto;font:700 13px 'Azeret Mono',monospace}
.shoe-bar{height:6px;border-radius:3px;background:var(--line);margin-top:8px;overflow:hidden}
.shoe-bar i{display:block;height:100%;border-radius:3px;transform-origin:left;animation:barIn .9s cubic-bezier(.2,.85,.2,1) .15s both}
.shoe-a{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tag{display:inline-block;font:700 9px 'Azeret Mono',monospace;letter-spacing:.08em;padding:2px 6px;border-radius:2px;border:1px solid var(--line);color:var(--mute)}
.tag.red{background:var(--rust);border-color:var(--rust);color:#fff}
.tag.amb{border-color:#E06A5C;color:#E06A5C}
.bc-split{display:flex;height:14px;border-radius:7px;overflow:hidden;margin:12px 0 6px;background:var(--line)}
.bc-split i{display:block;height:100%;transform-origin:left;animation:barIn .9s cubic-bezier(.2,.85,.2,1) .2s both}
.bc-leg{display:flex;justify-content:space-between;font:600 11px 'Azeret Mono',monospace;color:var(--mute)}

/* ---------- 8 · ecrane goale ---------- */
.empty{text-align:center;padding:14px 6px 4px}

/* ---------- stocare (window.storage → localStorage → memorie) ---------- */
const store={
  _mem:{},
  async get(k){
    try{ if(window.storage&&window.storage.get){const r=await window.storage.get(k,false);return r?JSON.parse(r.value):null;} }catch(e){}
    try{ const v=localStorage.getItem(k); if(v!=null) return JSON.parse(v); }catch(e){}
    return this._mem[k]!==undefined?this._mem[k]:null;
  },
  async set(k,v){
    this._mem[k]=v;
    try{ if(window.storage&&window.storage.set){await window.storage.set(k,JSON.stringify(v),false);return;} }catch(e){}
    try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){}
  }
};

 {i:'wind',t:'Masca de rezistență: nu face ce scrie pe cutie',
  p:'Masca nu simulează altitudinea. La altitudine scade presiunea parțială a oxigenului din aer; masca nu schimbă deloc compoziția aerului, doar îngreunează trecerea lui. Studiul lui Porcari din 2016 a măsurat exact asta: după antrenament cu mască, variabilele hematologice nu s-au schimbat — adică fix adaptarea pentru care oamenii cumpără masca, creșterea capacității de transport a oxigenului, nu apare. Autorii au concluzionat că dispozitivul funcționează ca un antrenor de mușchi respiratori, nu ca un simulator de altitudine. Ce rămâne e o întrebare mai mică: ajută antrenarea mușchilor respiratori? O meta-analiză pe 46 de studii a găsit îmbunătățiri reale ale performanței, mai mari la oameni mai puțin antrenați — deci la tine —, dar detectate mai ales la teste cu sarcină constantă și mai puțin la contra-cronometru, care e exact ce e proba de 1000 m.',
  k:['Nu o porți la alergare. Îți crește efortul perceput, îți strică ritmul și adaugă risc fără beneficiu dovedit — iar la 135 kg ritmul e deja lucrul greu de controlat','Dacă vrei totuși efectul respirator, se face în repaus, nu în mișcare: 30 de respirații forțate, de două ori pe zi','Varianta corectă a aparatului nu e masca, ci un dispozitiv cu prag de presiune, care îți dă o rezistență măsurabilă și reglabilă','Pune-o corect în ordine: e undeva după greutate, volum aerob, forță grea și cadență. Dacă alegi între 20 de minute cu masca și 20 de minute pe bicicletă, bicicleta câștigă de fiecare dată'],
  s:'Porcari et al. 2016 — mască de antrenament vs. altitudine · meta-analiză pe antrenamentul mușchilor respiratori, Sports Medicine — 46 de studii'},
 {i:'info',t:'Ce e supraevaluat: polarizarea 80/20 și strategia de ritm',
  p:'Merită spus și ce nu contează, fiindcă altfel pierzi timp pe lucruri care sună inteligent. Prima: regula 80/20, adică 80% din alergare ușoară și 20% tare. O meta-analiză pe 17 studii și 437 de subiecți a găsit un mic avantaj al distribuției polarizate pe VO2peak (0,24), dar numai la sportivi foarte antrenați și numai în intervenții mai scurte de 12 săptămâni. Pe timp de cursă, pe timp până la epuizare și pe praguri: niciun avantaj față de alte distribuții. La tine, cu trei alergări pe săptămână și un orizont de 8–9 luni, discuția e pur și simplu irelevantă. A doua: ritmul de cursă. Un studiu care a comparat plecare tare, ritm constant și final tare pe 800 m a găsit 130,0 / 130,7 / 129,7 secunde — diferențe fără semnificație statistică. Pleci aproape constant, cu un final puțin mai tare, și te oprești din optimizat.',
  k:['Nu-ți construi programul în jurul unui raport de intensitate — construiește-l în jurul a ce suportă articulațiile tale','Ritm aproape constant pe 1000 m, cu ultimii 200 m mai tari dacă mai ai','Greșeala reală de ritm e alta: pleci prea tare în primii 200 m fiindcă te simți bine, și plătești de trei ori mai mult pe ultimii 300','Ce contează la tine, în ordine: greutatea, volumul aerob total, forța grea, cadența. Restul e zgomot'],
  s:'meta-analiză pe distribuția intensității, Sports Medicine 2024 — 17 studii, 437 subiecți · studiu pe tipare de ritm la semifond, J Hum Sport Exerc'},
 {i:'flame',t:'Energia disponibilă — pragul care leagă dieta de oasele tale',
  p:'Asta e verificarea care a schimbat partea de nutriție, și a ieșit la limită. Energia disponibilă e ce rămâne pentru corp după ce plătești antrenamentul, raportat la masa slabă: aport minus costul antrenamentului, împărțit la kilogramele de masă slabă. Sub 30 kcal/kg începe zona în care literatura raportează testosteron scăzut, hormoni metabolici suprimați și densitate osoasă afectată. Cu Hybrid365 costul antrenamentului e mult mai mare decât înainte — trei alergări lungi plus patru sesiuni de sală — deci cifra ta reală e în fila Nutriție, calculată pe săptămâna curentă din planul tău. Dacă iese sub 30, ai două pârghii: mănânci mai mult sau alergi mai puțin. De asta ciclul de dietă rămâne, nu ca optimizare, ci ca protecție pentru singurul țesut care te poate opri.',
  k:['Cifra se vede în fila Nutriție și se recalculează singură când se schimbă greutatea sau planul de alergare','Sub 30 ai două pârghii, nu una: urci aportul sau scazi volumul de alergare. Nu poți avea și deficit agresiv, și volum mare','Pragul e validat pe sportivi slabi, iar tu ai rezerve mari de grăsime — deci e probabil mai conservator decât are nevoie cazul tău','Dar riscul de fisură de stres e deja ridicat din greutate; să acumulezi și energie scăzută peste el e exact combinația pe care n-o vrei'],
  s:'sinteză pe energia disponibilă scăzută la sportivii bărbați, The Sport Journal'},
 {i:'calc',t:'Ciclul de dietă: ce e real și ce a fost exagerat',
  p:'Studiul MATADOR e cel citat peste tot, și seamănă izbitor cu tine: 51 de bărbați cu obezitate, în jur de 110 kg, IMC 34. Grupa care a alternat două săptămâni de deficit cu două de menținere a pierdut 14,1 kg față de 9,1 kg la deficitul continuu, cu aceeași cantitate de săptămâni de restricție, și a păstrat mult mai bine rezultatul la șase luni: minus 11,1 kg față de minus 3,0. Partea onestă vine acum: o meta-analiză din 2024 pe 12 studii și 881 de oameni nu a găsit nicio diferență în pierderea de greutate sau grăsime — 5,49 kg față de 5,19 kg. MATADOR e o excepție, explicabilă prin condițiile ei de laborator. Ce a supraviețuit meta-analizei e altceva: metabolismul de repaus a scăzut cu 47 kcal/zi mai puțin la cei cu pauze, iar efectul a fost de 73 kcal/zi la oamenii cu obezitate față de 11 la cei slabi și antrenați. Deci pentru tine efectul e real, doar că e mai mic decât promite titlul.',
  k:['Două săptămâni deficit, două săptămâni la necesar — aliniate pe ciclul de antrenament','Săptămânile 3–4 au cel mai mare volum de alergare din ciclu și cad pe menținere','Nu te aștepta să slăbești mai repede. Te aștepți să păstrezi metabolismul și să poți duce drumul până la capăt','Al doilea motiv, care e raționamentul meu, nu al studiilor: săptămânile de menținere îți scot energia disponibilă din zona de risc pentru os'],
  s:'Byrne et al., Int J Obesity 2018 (MATADOR) — 51 bărbați cu obezitate · Poon et al. 2024, meta-analiză pe 12 studii, 881 subiecți'},
 {i:'heart',t:'Turele de noapte — și vestea bună dinăuntru',
  p:'Lucrezi în ture, deci somnul tău nu e o variabilă pe care o controlezi complet, iar asta atinge tot ce e în programul ăsta. Un studiu pe 24 de bărbați tineri a restricționat somnul la 4 ore pe noapte timp de cinci nopți și a măsurat sinteza proteinei musculare: a scăzut semnificativ față de grupa cu 8 ore. Până aici, prost. Partea care schimbă lucrurile: a treia grupă a făcut antrenament pe intervale de intensitate mare în zilele 2–4, cu același somn restricționat, și nu a mai avut nicio diferență față de grupa care dormea normal. Exercițiul a anulat efectul. Cu alte cuvinte, în săptămânile de noapte, antrenamentul nu e lucrul pe care să-l tai primul — e parțial antidotul.',
  k:['În săptămâna de noapte păstrezi cele patru zile de nucleu: Threshold, Easy run + Lower, Upper Strength + Power, Long run','Tai luni și miercuri — volumul în plus pe partea de sus — nu alergarea de bază și nu tot','Scade intensitatea, nu frecvența: mai bine patru sesiuni ușoare decât două grele și patru ratate','Avertismentul autorilor: nu a existat o grupă cu somn normal care să și facă exercițiu, deci nu știm dacă somnul bun plus antrenament ar fi fost și mai bun. Probabil da'],
  s:'Saner et al., J Physiol 2020 — 24 bărbați, 5 nopți de somn restricționat la 4 ore'},
 {i:'shield',t:'Fără descărcare planificată — ce spune cercetarea',
  p:'Hybrid365 nu are săptămână de descărcare, iar pentru forță asta are sprijin. Un studiu pe 39 de oameni antrenați a comparat o săptămână de pauză completă la mijlocul unui bloc de 9 săptămâni cu antrenament continuu. Creșterea musculară a fost aceeași, dar forța a crescut mai mult la grupa care nu s-a oprit: 16,4 kg față de 13 kg la genuflexiune. Autorii au recomandat ca descărcările planificate să fie folosite mai rar. Partea care rămâne pe umerii tăi e alergarea: oasele și tendoanele se adaptează mai încet decât mușchiul, iar la greutatea ta ele sunt primele care cedează.',
  k:['Pentru ridicări: continuitatea bate pauza programată','Pentru alergare: ai nevoie de o săptămână mai ușoară când apare durerea, nu la calendar','Semnalul e în Jurnalul de alergare — durere 2 din 3 de două ori în ultimele 6 ieșiri'],
  s:'Coleman et al., PeerJ 2024 — 39 subiecți antrenați, pauză de o săptămână vs. antrenament continuu'},
 {i:'shield',t:'Regula de 10% nu te apără singură — simptomul o face',
  p:'Creșterea de 10% pe săptămână e citată peste tot, dar a fost testată direct într-un studiu randomizat pe 532 de alergători începători: grupa care a urmat regula a avut 20,8% accidentări, grupa cu progresie obișnuită 20,3%. Practic identic. Explicația e că distanța nu e totuna cu încărcarea — o creștere de 1 km/h de viteză poate adăuga 20–40% la încărcarea pe țesut, cu aceeași distanță parcursă. Regula rămâne în program ca plafon, dar semnalul care decide cu adevărat e altul, și îl ai de la medicina sportivă: disconfortul musculo-scheletal nu trebuie să persiste a doua zi și nu trebuie să fie mai mare decât în ziua antrenamentului.',
  k:['Regula de oprire: dacă doare a doua zi mai tare decât în ziua alergării, sesiunea următoare scade, nu crește','Durere ascuțită, punctiformă, pe os — te oprești și mergi la medic; așa începe fisura de stres','Nu crești volumul și viteza în aceeași săptămână — alegi una','Între threshold (marți) și long run (sâmbătă) sunt patru zile — nu le muta una lângă alta când îți schimbi turele'],
  s:'Buist et al. 2008 — studiu randomizat, 532 alergători începători · Vincent & Vincent, PM&R 2013'},
 {i:'trend',t:'Cât de aproape de eșec — și de ce răspunsul diferă',
  p:'O serie de meta-regresii din 2024 a găsit două lucruri diferite pentru cele două obiective. Pentru masă musculară există o relație clară: cu cât seriile se termină mai aproape de eșec, cu atât crește mai mult mușchiul. Pentru forță, relația e practic nulă — câștigi la fel indiferent dacă opreai la 4 repetări în rezervă sau mergeai până la capăt. Asta îți dă o regulă simplă și, cu spatele tău, și una sigură: la Romanian Deadlift și Hack Squat eșecul nu adaugă nimic.',
  k:['Hipertrofie (Lateral Raise, Cable Fly, curls, Leg Press): RIR 1–2','Forță (Bench Press 5×3–5, Hack Squat 4×4–6, Weighted Pull Up): RIR 1–2, cum scrie în program — nu câștigi nimic mergând la eșec','Nu ține respirația în repetarea grea: expiri prin punctul dificil','Autorii înșiși avertizează că relația exactă rămâne neclară — estimarea RIR e imprecisă'],
  s:'Robinson et al., Sports Medicine 2024 — serie de meta-regresii pe proximitatea față de eșec'},
 {i:'info',t:'Ce NU spune cercetarea — despre „cel mai bun exercițiu"',
  p:'Ai cerut cele mai bune exerciții, așa că merită spus și ce nu se poate susține. O trecere în revistă din 2025 a 23 de studii EMG pe activarea dorsalului a concluzionat explicit că datele nu permit un clasament între exerciții: metodologiile diferă prea mult. În interiorul aceluiași exercițiu, variantele de priză la pull-up dau activare aproape identică. În plus, EMG măsoară activare acută, nu creștere în timp. Deci nu există un „cel mai bun exercițiu" pe care să-l ratezi — contează progresia încărcării și cât de aproape de eșec termini seria.',
  k:['Nu există dovezi pentru „cel mai bun exercițiu de spate" — fă pull-ups bine, adaugă rows','Priza contează mult mai puțin decât se spune; alege-o pe cea confortabilă pentru cot','Pullover-ul activează preferențial pieptul, nu dorsalul — nu e un exercițiu de spate','Varietatea are rost pentru articulații și pentru cap, nu pentru mușchi'],
  s:'Review narativ EMG dorsal, J Funct Morphol Kinesiol 2025 — 23 de studii'},
 {i:'layers',t:'Structura: Hybrid365',
  p:'Trei alergări cu roluri diferite — threshold pentru prag, easy pentru bază, long run pentru rezistență — trei sesiuni de upper, una de lower și una de conditioning. Piciorul e antrenat o singură dată, intenționat: doza minimă care construiește forță fără să-ți strice alergările. Asta se potrivește cu cercetarea de antrenament concurent: interferența e mică pentru masă și forță, dar mai mare pentru puterea explozivă — de aceea finisher-ul de putere e pe partea de sus.',
  k:['Hack Squat în loc de Back Squat — singura modificare','Fără blocuri și fără porți: aceeași săptămână, repetată în cicluri de 4 săptămâni','Ridicările cresc prin greutate, alergarea prin reprize și minute','Sesiune ratată nu se recuperează — se sare. Nucleul de 4 zile e ce contează în săptămânile scurte'],
  s:'Hybrid365 — Hybrid Training Split (Lift, Run & Perform)'}
];

/* ---------- jurnal de mese ---------- */
function mlogDay(dk){ return ((S.mlog||{})[dk])||[]; }
function dayTot(dk){
  return mlogDay(dk).reduce((a,m)=>({k:a.k+m.k,p:a.p+m.p,c:a.c+m.c,g:a.g+m.g}),{k:0,p:0,c:0,g:0});
}
// zilele complet logate hrănesc estimarea TDEE (zilele parțiale ar denatura media)
function kcalDays(){
  const out={}, ml=S.mlog||{};
  Object.keys(ml).forEach(dk=>{ const t=dayTot(dk); if(ml[dk].length>=3 && t.k>=1500) out[dk]=Math.round(t.k); });
  return out;
}
function barRow(lbl,val,tgt,unit,col){
  const pct=tgt?Math.min(100,Math.round(val/tgt*100)):0;
  const over=tgt&&val>tgt*1.05;
  return `<div class="mrow">
    <div class="mrow-h"><span>${lbl}</span>
      <span class="mono ${over?'over':''}">${Math.round(val)}${unit} / ${tgt}${unit}</span></div>
    <div class="mbar"><i style="width:${pct}%;background:${over?'var(--bad)':col}"></i></div></div>`;
}

/* ---------- nutriție: motor adaptiv ---------- */
const KCAL_PER_KG=7700;               // ~7700 kcal / kg țesut
const SLOTS=[['mic dejun',0,.25],['gustare 1',3,.10],['prânz',1,.275],['gustare 2',3,.10],['cină',2,.275]];

function nSet(){ return Object.assign({sex:'m',age:23,h:200,startW:135,goalW:105,rate:0.6,act:1.55,cycle:true,
  bf:28, eq:'cunningham', manual:null},S.nutri||{}); }
/* ---------- necesar caloric: patru ecuații, aceeași persoană ----------
   Meta-analiza din 2023 pe sportivi (Sports Medicine) a găsit că ecuațiile bazate pe masa slabă —
   Cunningham în frunte — și Harris-Benedict nu diferă semnificativ de calorimetria indirectă,
   în timp ce Mifflin-St Jeor sub- sau supraestimează semnificativ. Le arăt pe toate ca să vezi
   incertitudinea reală, nu o singură cifră falsă de precisă. */
const EQS=[
 ['cunningham','Cunningham 1980','masă slabă','Prima în meta-analiza pe sportivi. Are nevoie de procentul de grăsime.'],
 ['harris','Harris-Benedict','greutate','Fără diferență semnificativă față de măsurătoare la sportivi.'],
 ['katch','Katch-McArdle','masă slabă','Aproape identică cu Cunningham, coeficienți puțin mai mici.'],
 ['mifflin','Mifflin-St Jeor','greutate','Standardul din majoritatea aplicațiilor — și cel care a ieșit prost la sportivi.']
];
const ACTS=[[1.2,'Sedentar'],[1.375,'Ușor'],[1.55,'Moderat'],[1.725,'Activ'],[1.9,'Foarte activ']];
function ffmOf(w){ const n=nSet(), mb=(typeof measuredBF==='function')?measuredBF():null;
  return w*(1-((mb!=null?mb:(+n.bf||0)))/100); }
function bmrAll(w){
  const n=nSet(), F=ffmOf(w);
  return { ffm:F,
    mifflin:    Math.round(10*w + 6.25*n.h - 5*n.age + 5),
    harris:     Math.round(88.362 + 13.397*w + 4.799*n.h - 5.677*n.age),
    cunningham: Math.round(500 + 22*F),
    katch:      Math.round(370 + 21.6*F) };
}
function bmrPick(w){ const A=bmrAll(w), n=nSet(); return A[n.eq]||A.cunningham; }
/* proteină pe masa slabă (Helms 2014: 2.3–3.1 g/kg FFM); cu cât ești mai slab, cu atât mai sus */
function proteinFactor(){ const bf=+nSet().bf||0; return bf>25?2.3:bf>18?2.6:2.9; }
function weights(){ const w=S.weights||{}; return Object.keys(w).sort().map(k=>({d:k,w:w[k]})); }
function avgRange(arr,from,to){ const s=arr.slice(from,to); return s.length? s.reduce((a,b)=>a+b.w,0)/s.length : null; }

// media mobilă pe 7 zile — filtrează zgomotul din apă
function trend(){
  const a=weights(); if(a.length<4) return null;
  const last=avgRange(a,Math.max(0,a.length-7),a.length);
  const prev=avgRange(a,Math.max(0,a.length-14),Math.max(0,a.length-7));
  const days=Math.min(7,a.length-1);
  return {last, prev, perWeek: (prev!=null&&days>0)? (last-prev) : null, n:a.length};
}

// TDEE din date reale (aport + variație de greutate) — bate orice formulă
function tdeeAdaptive(){
  const t=trend(), n=nSet();
  const kc=kcalDays(), keys=Object.keys(kc).sort().slice(-14);
  const w=(t&&t.last?t.last:n.startW);
  const est=Math.round(bmrPick(w)*n.act);
  const eqName=(EQS.find(e=>e[0]===n.eq)||EQS[0])[1];
  if(!t||t.perWeek==null||keys.length<7) return {kcal:est, measured:false,
    src:keys.length?`estimat — mai ai ${7-keys.length} zile logate complet până la măsurare`:`estimat (${eqName} × activitate)`};
  const avgIn=keys.reduce((a,k)=>a+kc[k],0)/keys.length;
  const adaptive=Math.round(avgIn - (t.perWeek*KCAL_PER_KG/7));
  if(adaptive<1600||adaptive>6000) return {kcal:est, measured:false, src:'estimat (datele logate sunt neverosimile)'};
  return {kcal:adaptive, measured:true, src:`măsurat din ${keys.length} zile de aport + trendul greutății`};
}

// macro: proteina pe greutatea-țintă, grăsimea cu prag minim, restul carbohidrați
/* costul energetic al antrenamentului, net peste metabolismul de repaus.
   MET aproximativi: calistenice 5, alergare ușoară 5.5, alergare tare 9. */
const MET={cal:5, easy:5.5, hard:9, rest:0};
function exKcalDay(){
  const b=activeBlock(), w=curWeight(), wk=nextDay(b).w;
  let k=0;
  BLOCKS[b].days.forEach((_,i)=>{ const d=dayFor(b,wk,i);
    (d.seg||[[d.k,d.min]]).forEach(x=>{ const m=MET[x[0]]||0; if(m&&x[1]) k+=(m-1)*w*(x[1]/60); }); });
  return k/CYC_DAYS;
}
/* săptămânile 1–2 din ciclu = deficit, 3–4 = menținere. */
function nPhase(){
  if(!nSet().cycle) return {cut:true, w:null, name:'deficit continuu'};
  const b=activeBlock(), nd=nextDay(b), w=nd.w;
  const cut = w<2;
  return {cut, w, name: cut?('deficit · săptămâna '+(w+1)+' din 2'):('menținere · săptămâna '+(w-1)+' din 2')};
}
function energyAvail(T){
  const ex=exKcalDay();
  return {ea:(T.kcal-ex)/T.ffm, ex:Math.round(ex)};
}
function targets(){
  const n=nSet(), t=trend();
  const cur=t&&t.last?t.last:n.startW;
  const td=tdeeAdaptive();
  const bmr=bmrPick(cur);
  // plafon de siguranță: deficitul nu trece de 25% din necesar și nu coborâm sub BMR×1.1
  const wanted=n.rate*KCAL_PER_KG/7;
  const maxDef=Math.min(wanted, td.kcal*0.25);
  const floor=Math.max(Math.round(bmr*1.1), 1900);
  const ph=nPhase();
  let kcal = n.manual || (ph.cut ? Math.max(floor, Math.round((td.kcal-maxDef)/10)*10)
                                 : Math.round(td.kcal/10)*10);
  const capped = !n.manual && ph.cut && maxDef < wanted-20;
  const pf=proteinFactor(), p=Math.round(ffmOf(cur)*pf);   // g/kg masă slabă (Helms 2014)
  const fMin=Math.round(cur*0.6);             // prag hormonal
  let f=Math.round(cur*0.7), c=Math.round((kcal-p*4-f*9)/4);
  if(c<80){ f=Math.max(fMin,Math.round((kcal-p*4-80*4)/9)); c=Math.round((kcal-p*4-f*9)/4); }
  return {kcal,p,c,f,fMin,cur,pf,ffm:ffmOf(cur),bmr,tdee:td,capped,phase:ph,
          realRate:((td.kcal-kcal)*7/KCAL_PER_KG)};
}

// verdict adaptiv: stagnare ≥10 zile → tai din carbohidrați, proteina rămâne
function verdict(){
  const a=weights(), t=trend(), n=nSet();
  if(a.length<10) return {s:'wait', msg:`Mai ai nevoie de ${10-a.length} cântăriri ca să pot decide. Cântărește-te dimineața, după toaletă, înainte de mâncare.`};
  const span=(new Date(a[a.length-1].d)-new Date(a[Math.max(0,a.length-10)].d))/864e5;
  const rate=t.perWeek;
  if(rate==null) return {s:'wait', msg:'Încă strâng date pentru trend.'};
  if(rate<=-n.rate*1.5) return {s:'fast', cut:0, msg:`Scazi ${Math.abs(rate).toFixed(2)} kg/săpt — prea repede. Riști să pierzi mușchi. Adaugă ~150 kcal din carbohidrați.`};
  if(rate<=-n.rate*0.6) return {s:'ok', cut:0, msg:`Scazi ${Math.abs(rate).toFixed(2)} kg/săpt — exact în țintă. Nu schimba nimic.`};
  if(rate<0) return {s:'slow', cut:0, msg:`Scazi doar ${Math.abs(rate).toFixed(2)} kg/săpt. Mai așteaptă câteva zile înainte să tai — poate fi apă.`};
  return {s:'stall', cut:180, msg:`Greutatea stă de ~${Math.round(span)} zile. Taie 180 kcal — toate din carbohidrați (~45 g). Proteina și grăsimea rămân neatinse.`};
}

function slotTargets(){
  const T=targets();
  return SLOTS.map(([name,cat,share])=>({name,cat,kcal:Math.round(T.kcal*share),p:Math.round(T.p*share)}));
}
function pickMeals(cat,kcalT,limit){
  return MEALS.filter(m=>m[0]===cat && (!S.mFilter || m[6]===1))
    .sort((a,b)=>Math.abs(a[2]-kcalT)-Math.abs(b[2]-kcalT)).slice(0,limit);
}

/* calculatorul de necesar caloric — patru ecuații + măsurătoarea care le bate pe toate */
function calcPanel(T,n){
  const w=T.cur, A=bmrAll(w);
  const vals=EQS.map(e=>A[e[0]]), lo=Math.min(...vals), hi=Math.max(...vals);
  const rows=EQS.map(e=>{
    const on=n.eq===e[0], v=A[e[0]];
    return `<tr class="${on?'top':''}" style="cursor:pointer" data-act="neq" data-k="${e[0]}">
      <td style="text-align:left">${on?'▸ ':''}${e[1]}</td>
      <td class="n">${v}</td><td style="color:var(--mute2)">${e[2]}</td></tr>`;
  }).join('');
  return `<div class="panel">
    <div class="panel-t">${ic('calc')} Calculator necesar caloric</div>
    <p class="muted">Nicio ecuație nu e exactă pentru un individ. Ți le arăt pe toate patru ca să vezi
    incertitudinea reală — apoi, după două săptămâni de cântar și mâncare logată, aplicația calculează

/* ---------- vizualizări ---------- */
/* nota continuă: unde cade valoarea între pragurile standardului */
function contNote(v,tab,higher){
  if(v==null||v==='') return null;
  for(let n=1;n<10;n++){
    const a=tab[n],b=tab[n+1];
    if(v>=Math.min(a,b)&&v<=Math.max(a,b)) return n+(v-a)/(b-a);
  }
  const step=(tab[10]-tab[1])/9;
  if(higher) return v>tab[10]?10:1+(v-tab[1])/step;
  return v<tab[10]?10:1+(v-tab[1])/step;
}
function noteColor(n){
  if(n==null) return 'var(--mute2)';
  return n>=9.995?'var(--accent-hi)':n>=9?'var(--brass)':'var(--rust)';
}
/* o probă așezată pe scara 1→10, cu zona-țintă 9–10 marcată */
function rulerSVG(v,tab,higher){
  const W=320,ML=9,MR=9,BASE=19,IW=W-ML-MR;
  const X=n=>ML+(n-1)/9*IW;
  const n=contNote(v,tab,higher);
  const cn=n==null?null:Math.max(1,Math.min(10,n));
  let ticks='',labels='';
  for(let i=1;i<=10;i++){
    const maj=(i===1||i===5||i===9||i===10),x=X(i).toFixed(1);
    ticks+=`<line class="tick ${maj?'maj':''}" x1="${x}" y1="${maj?9:12.5}" x2="${x}" y2="${BASE}"/>`;
    labels+=`<text class="lbl ${maj?'maj':''}" x="${x}" y="28.5" text-anchor="middle">${i}</text>`;
  }
  const col=noteColor(n);
  const mx=cn==null?0:X(cn);
  const mk=cn==null?'':`<g class="mkg"><line class="mk" x1="${mx.toFixed(1)}" y1="3.5" x2="${mx.toFixed(1)}" y2="${BASE}" stroke="${col}"/>
    <circle class="mkdot" cx="${mx.toFixed(1)}" cy="3.5" r="2.7" fill="${col}"/></g>`;
  const off=n!=null&&n<1
    ? `<text class="lbl" x="${(X(1)+7).toFixed(1)}" y="7" fill="${col}" text-anchor="start">sub nota 1</text>`:'';
  return `<svg class="rsvg" viewBox="0 0 ${W} 33" aria-hidden="true">
    <rect class="band10" x="${X(9).toFixed(1)}" y="${BASE-6}" width="${(X(10)-X(9)).toFixed(1)}" height="6"/>
    <line class="base" x1="${ML}" y1="${BASE}" x2="${W-MR}" y2="${BASE}"/>
    ${ticks}${mk}${off}${labels}</svg>`;
}
function rulerRow(name,sub,val,tab,higher,fmt){
  const nt=val==null?null:(higher?noteHigher(val,tab):noteLower(val,tab));
  return `<div class="ruler">
    <div class="ruler-h">
      <span class="ruler-n">${name}</span><span class="ruler-sub">${sub}</span>
      <span class="ruler-v mono" style="color:${val==null?'var(--mute2)':'var(--bone)'}">${val==null?'—':fmt(val)}</span>
      <span class="ruler-note mono" style="color:${noteColor(nt)}">${nt==null?'—':nt===0?'&lt;1':nt}</span>
    </div>${rulerSVG(val,tab,higher)}</div>`;
}
function gaugeSVG(avg){
  const R=52,C=Math.PI*R;
  const frac=avg==null?0:Math.max(0,Math.min(1,avg/10));
  const col=avg==null?'var(--mute2)':avg>=9.995?'var(--ok)':avg>=9?'var(--steel)':'var(--bad)';
  const ang=-90+frac*180;
  let ticks='';
  for(let i=0;i<=10;i++){
    const a=(-90+i*18)*Math.PI/180, major=(i===9||i===10), r1=major?40:45, r2=52;
    ticks+=`<line x1="${(65+r1*Math.sin(a)).toFixed(2)}" y1="${(68-r1*Math.cos(a)).toFixed(2)}"
      x2="${(65+r2*Math.sin(a)).toFixed(2)}" y2="${(68-r2*Math.cos(a)).toFixed(2)}"
      stroke="${i===10?'var(--signal)':'rgba(185,201,217,.28)'}" stroke-width="${major?1.6:1}"/>`;
  }
  return `<div class="gauge-box">
    <svg width="150" height="88" viewBox="0 0 130 76" aria-hidden="true">
      <path d="M12 68 A53 53 0 0 1 118 68" fill="none" stroke="rgba(185,201,217,.1)" stroke-width="2"/>
      <path d="M12 68 A53 53 0 0 1 118 68" fill="none" stroke="${col}" stroke-width="2"
        stroke-dasharray="${C}" stroke-dashoffset="${C*(1-frac)}"/>
      ${ticks}
      <g transform="rotate(${ang} 65 68)"><line x1="65" y1="68" x2="65" y2="26"
        stroke="${col}" stroke-width="2.4" stroke-linecap="round"/></g>
      <circle cx="65" cy="68" r="3.4" fill="var(--slab)" stroke="${col}" stroke-width="1.6"/>
    </svg>
    <div class="gauge-note mono" style="color:${col}">${avg==null?'—.—':avg.toFixed(2)}</div>
    <div class="gauge-cap">medie · maxim 10.00</div>
  </div>`;
}

function badge(n){
  if(n==null) return `<span class="nbadge" style="color:var(--mute2)">—</span>`;
  const c=n>=10?'var(--accent-hi)':n>=9?'var(--brass)':n>=7?'var(--tan)':'var(--rust)';
  return `<span class="nbadge count" style="color:${c}">${n===0?'&lt;1':n}</span>`;
}

function lineChart(pts,{target,reversed,fmt,labels,tlabel}){
  if(!pts.length) return '';
  const W=680,H=220,ml=52,mr=14,mt=14,mb=28;
  const vals=pts.concat([target]);
  let lo=Math.min(...vals), hi=Math.max(...vals);
  if(hi===lo){hi+=1;lo-=1;}
  const pad=(hi-lo)*0.12; lo-=pad; hi+=pad;
  const x=i=>ml+(pts.length===1?(W-ml-mr)/2:i*(W-ml-mr)/(pts.length-1));
  const y=v=>{const f=(v-lo)/(hi-lo);return reversed?mt+f*(H-mt-mb):H-mb-f*(H-mt-mb);};
  let grid='',axis='';
  for(let i=0;i<=3;i++){
    const v=lo+(hi-lo)*i/3, yy=y(v);
    grid+=`<line class="grid" x1="${ml}" y1="${yy.toFixed(1)}" x2="${W-mr}" y2="${yy.toFixed(1)}"/>`;
    axis+=`<text class="axis" x="${ml-8}" y="${(yy+3.5).toFixed(1)}" text-anchor="end">${fmt(v)}</text>`;
  }
  const d=pts.map((v,i)=>`${i?'L':'M'}${x(i).toFixed(1)} ${y(v).toFixed(1)}`).join(' ');
  const dots=pts.map((v,i)=>`<circle class="pt" cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="3"/>`).join('');
  const xl=labels.map((l,i)=>`<text class="axis" x="${x(i).toFixed(1)}" y="${H-8}" text-anchor="middle">${esc(l)}</text>`).join('');
  const ty=y(target);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="height:210px">
    ${grid}${axis}
    <line class="tline" x1="${ml}" y1="${ty.toFixed(1)}" x2="${W-mr}" y2="${ty.toFixed(1)}"/>
    <text class="tlabel" x="${W-mr}" y="${(ty-6).toFixed(1)}" text-anchor="end">${tlabel||'nota 10'}</text>
    <path class="path" pathLength="1" d="${d}"/>${dots}${xl}
  </svg>`;
}

/* recordurile recente, din istoricul tuturor exercițiilor */
function recentPRs(n){
  const ev=[], L=S.lifts||{};
  Object.keys(L).forEach(nm=>{ let run=0; (L[nm]||[]).forEach(x=>{ const b=Math.max(0,...x.s.map(([w,r])=>e1rm(w,r)));
    if(b>run&&run>0) ev.push({nm,d:x.d,b,prev:run}); if(b>run) run=b; }); });
  return ev.sort((a,b)=>a.d<b.d?1:a.d>b.d?-1:b.b-a.b).slice(0,n);
}
function ringSVG(frac,col,r,sw,C0){
  const C=2*Math.PI*r, f=Math.max(0,Math.min(1,frac||0));
  return `<circle cx="42" cy="42" r="${r}" fill="none" stroke="rgba(185,201,217,.1)" stroke-width="${sw}"/>
    <circle class="az-ring" cx="42" cy="42" r="${r}" fill="none" stroke="${col}" stroke-width="${sw}" stroke-linecap="round"
      stroke-dasharray="${C}" stroke-dashoffset="${C*(1-f)}" transform="rotate(-90 42 42)" style="--c:${C}"/>`;
}
