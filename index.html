/* ---------- greutăți pe serie + progresie ---------- */
// schema țintă din descriere: "4×8–10", "5×3–6", "12 runde × 5 rep"
function parseScheme(detail){
  const t=(detail||'').replace(/\s/g,'');
  // schemă în val: "6serii:8-5-5-5-3-8rep"
  const wv=t.match(/(\d+)serii?:((?:\d+-){2,}\d+)rep/i);
  if(wv){
    const seq=wv[2].split('-').map(Number);
    return {sets:+wv[1], lo:Math.min(...seq), hi:Math.max(...seq), wave:seq};
  }
  const m=t.match(/(\d+)(?:runde)?[×x](\d+)(?:[–-](\d+))?(?![\ds])/i);
  if(!m) return null;
  const sets=+m[1], lo=+m[2], hi=m[3]?+m[3]:+m[2];
  if(sets>20||lo>60) return null;
  return {sets,lo,hi};
}
function liftKey(name){ return name.replace(/^ABDOMEN — /,'').trim(); }
function liftHist(name){ return ((S.lifts||{})[liftKey(name)])||[]; }
/* ultima greutate folosită la exercițiul ăsta, din orice zi a programului (inclusiv azi) */
function lastLift(name){
  const h=liftHist(name);
  for(let i=h.length-1;i>=0;i--){ const ss=h[i].s||[];
    for(let j=ss.length-1;j>=0;j--) if(ss[j][0]>0) return {w:ss[j][0], r:ss[j][1], d:h[i].d}; }
  return null;
}
const dayLabel=k=>{ if(k===todayKey()) return 'azi';
  const d=new Date(k+'T00:00'); return DAYN[(d.getDay()+6)%7].toLowerCase()+' '+shortDate(k); };
/* contor de runde pentru EMOM / AMRAP / conditioning */
const isCountEx=n=>/EMOM|AMRAP|Conditioning/i.test(n);
function cntHist(name){ return ((S.counts||{})[liftKey(name)])||[]; }
function cntToday(name){ const h=cntHist(name), l=h[h.length-1]; return l&&l.d===todayKey()?l.n:0; }
function cntPrev(name){ const h=cntHist(name).filter(x=>x.d!==todayKey()); return h[h.length-1]||null; }
function cntBox(name){
  const emom=/EMOM/i.test(name), n=cntToday(name), p=cntPrev(name);
  return `<div class="cntbox">
    <span class="cl">${emom?'Runde reușite':'Runde făcute'}</span>
    <button class="btn ghost cbtn" data-act="cntDec" data-n="${esc(name)}">−</button>
    <input class="inp cinp mono" type="number" inputmode="numeric" min="0" value="${n}" data-cntx="${esc(name)}">
    <button class="btn cbtn" data-act="cntInc" data-n="${esc(name)}">+</button>
    <span class="cprev mono">${emom?'din 10 minute · ':''}${p?'data trecută ('+dayLabel(p.d)+'): '+p.n+' runde':'prima dată — notează câte ai făcut'}</span>
  </div>`;
}
async function setCount(name,n){
  const nm=liftKey(name), C=Object.assign({},S.counts||{}), h=(C[nm]||[]).slice(), tk=todayKey();
  n=Math.max(0,Math.round(+n||0));
  if(h.length&&h[h.length-1].d===tk) h[h.length-1]={d:tk,n}; else h.push({d:tk,n});
  C[nm]=h.slice(-30); await save('zece:counts',C,'counts');
}
function e1rm(w,r){ return w>0? Math.round(w*(1+r/30)) : 0; }
function stepFor(name){
  const n=name.toLowerCase();
  if(/weighted|vest|centur/.test(n)) return 2.5;
  return 2.5;
}
// dublă progresie: umpli intervalul de repetări, apoi crești greutatea
function suggest(name, detail){
  const sc=parseScheme(detail); if(!sc) return null;
  const h=liftHist(name); const last=h[h.length-1];
  if(!last||!last.s.length) return {txt:`${sc.sets}×${sc.lo}${sc.hi>sc.lo?'–'+sc.hi:''} — prima sesiune, alege o greutate cu care termini toate seriile`,first:true};
  const ws=last.s.map(x=>x[0]), rs=last.s.map(x=>x[1]);
  const w=Math.max(...ws), minR=Math.min(...rs), done=last.s.length;
  const bw=w<=0;
  if(sc.wave && !bw){
    const seq=sc.wave.join('-');
    // seria cea mai grea = cea cu cele mai puține repetări din val
    const iTop=sc.wave.indexOf(Math.min(...sc.wave));
    const topSet=last.s[iTop];
    if(topSet && topSet[1]>=sc.wave[iTop]){
      const nw=w+stepFor(name);
      return {txt:`${seq} — ai închis seria grea, urcă la ${nw} kg pe seriile de ${sc.wave[iTop]}`, w:nw, r:sc.wave[0], up:true};
    }
    return {txt:`${seq} @ până la ${w} kg — repetă greutatea până închizi seria de ${sc.wave[iTop]}`, w:ws[0]||w, r:sc.wave[0]};
  }
  if(bw){
    const tot=rs.reduce((a,b)=>a+b,0);
    return {txt:`${sc.sets}×${minR+1} rep (data trecută: ${rs.join('/')} = ${tot} total)`, w:0, r:minR+1};
  }
  if(minR>=sc.hi && done>=sc.sets){
    const nw=w+stepFor(name);
    return {txt:`${sc.sets}×${sc.lo} @ ${nw} kg — ai umplut intervalul, crește greutatea`, w:nw, r:sc.lo, up:true};
  }
  if(minR<sc.lo){
    const nw=Math.max(stepFor(name), Math.round((w*0.92)/stepFor(name))*stepFor(name));
    return {txt:`${sc.sets}×${sc.lo} @ ${nw} kg — ai ratat intervalul, scade ~8%`, w:nw, r:sc.lo, down:true};
  }
  // altă zi poate avea altă schemă (luni 4×6–8, vineri 5×3–5): ținta rămâne în intervalul de azi
  const rr=Math.max(sc.lo,Math.min(minR+1,sc.hi));
  return {txt:`${sc.sets}×${rr} @ ${w} kg — ${rr>minR?'aceeași greutate, adaugă o repetare':'aceeași greutate, toate seriile în interval'}`, w, r:rr};
}
/* seriile de încălzire, din greutatea de lucru */
function warmupFor(name,W){
  const n=liftKey(name);
  let kind=null;
  if(/^(Bench Press|Close Grip Bench Press|Romanian Deadlift|Push Press|Hip Thrust)$/.test(n)) kind='bar';
  else if(/^(Hack Squat|Leg Press)$/.test(n)) kind='sled';
  else if(/^(Incline Dumbbell Press|Flat Dumbbell Press|Seated Overhead Press|Dumbbell Shoulder Press)$/.test(n)) kind='db';
  else if(/^Weighted Pull Up$/.test(n)) kind='pull';
  if(!kind) return null;
  if(!(W>0)) return {kind,sets:[]};
  const r25=x=>Math.round(x/2.5)*2.5, r2=x=>Math.max(2,Math.round(x/2)*2);
  let out=[];
  if(kind==='bar'){ out.push([20,10]); [[.5,5],[.7,3],[.85,1]].forEach(([p,r])=>{ const w=r25(W*p); if(w>20&&w<W) out.push([w,r]); }); }
  if(kind==='sled'){ [[.4,8],[.6,5],[.8,3]].forEach(([p,r])=>{ const w=r25(W*p); if(w>0&&w<W) out.push([w,r]); }); }
  if(kind==='db'){ [[.5,8],[.75,4]].forEach(([p,r])=>{ const w=r2(W*p); if(w<W) out.push([w,r]); }); }
  if(kind==='pull'){ out.push([0,5]); const w=r25(W*.5); if(w>0&&w<W) out.push([w,3]); }
  out=out.filter((x,i)=>!i||x[0]!==out[i-1][0]);
  return {kind,sets:out};
}
const WU_LBL={bar:'bara goală = 20 kg',sled:'kg pe aparat, fără sanie',db:'kg pe ganteră',pull:'kg în centură'};
function warmupUI(name,W,hasSets){
  const wu=warmupFor(name,W); if(!wu) return '';
  if(!wu.sets.length) return `<div class="wu"><div class="wu-h"><span>Încălzire</span></div>
    <div class="wu-note">Apare după prima sesiune — are nevoie de greutatea de lucru.</div></div>`;
  const done=S.wuDone||{};
  return `<div class="wu ${hasSets?'done':''}"><div class="wu-h"><span>Încălzire · lucru ${W} kg</span><span>${WU_LBL[wu.kind]}</span></div>
    <div class="wu-row">${wu.sets.map((x,i)=>{ const k=liftKey(name)+'|'+i;
      return `<button class="wu-p ${done[k]?'on':''}" data-act="wuTick" data-k="${esc(k)}">${x[0]>0?x[0]+' kg':'corp'} × ${x[1]}</button>`; }).join('')}</div></div>`;
}
/* recordul de dinaintea zilei de azi — cu el comparăm seriile de azi */
function priorBest(name){
  let b=0; liftHist(name).forEach(s=>{ if(s.d===todayKey()) return; s.s.forEach(([w,r])=>{ const e=e1rm(w,r); if(e>b) b=e; }); });
  return b;
}
function bestE1rm(name){
  let b=0,d='';
  liftHist(name).forEach(s=>s.s.forEach(([w,r])=>{const e=e1rm(w,r); if(e>b){b=e;d=s.d;}}));
  return b?{v:b,d}:null;
}
function setLogUI(name, detail, dk, id){
  const sc=parseScheme(detail), sg=suggest(name,detail), h=liftHist(name);
  const todaySess=(h[h.length-1]&&h[h.length-1].d===todayKey())?h[h.length-1]:null;
  const sets=todaySess?todaySess.s:[];

  // greutatea precompletată: seria anterioară de azi, altfel sugestia, altfel ultima greutate folosită
  const prevSet=sets[sets.length-1];
  const preW=prevSet?prevSet[0]:(sg&&sg.w?sg.w:(last?last.w:0));
  let preR=sc&&sc.wave?(sc.wave[sets.length]||sc.wave[sc.wave.length-1]):(prevSet?prevSet[1]:(sg&&sg.r?sg.r:(sc?sc.lo:0)));
  if(sc&&!sc.wave&&!prevSet) preR=Math.max(sc.lo,Math.min(preR,sc.hi));
  const pb=priorBest(name);
  const rows=sets.map((st,i)=>`<div class="setrow ${justSet===liftKey(name)&&i===sets.length-1?'new':''}">
    <span class="setn mono">${i+1}</span>

      data-setedit="${esc(name)}" data-i="${i}" data-f="r">
    <span class="sete mono ${pb&&st[0]>0&&e1rm(st[0],st[1])>pb?'pr':''}">${st[0]>0?(pb&&e1rm(st[0],st[1])>pb?'<b>PR</b>':'')+e1rm(st[0],st[1])+' 1RM':''}</span>
    <button class="btn ghost sm" data-act="setdel" data-n="${esc(name)}" data-i="${i}">${ic('trash')}</button>
  </div>`).join('');
  return `<div class="setlog">
    ${last?`<div class="lastw">Ultima greutate: <b>${last.w} kg</b> × ${last.r} <span class="hint">· ${dayLabel(last.d)}</span></div>`:''}
    ${warmupUI(name,(sg&&sg.w)||(last&&last.w)||0,sets.length>0)}
    ${sc&&sc.wave?`<div class="prevline mono">Schema: ${sc.wave.map((r,i)=>`<span class="${i===sets.length?'wnow':''}">${r}</span>`).join(' · ')}</div>`:''}
    ${sg?`<div class="sugg ${sg.up?'up':sg.down?'down':''}">${ic('trend')} <b>Următoarea:</b> ${esc(sg.txt)}</div>`:''}
    ${prev?`<div class="prevline mono">Sesiunea trecută (${shortDate(prev.d)}): ${prev.s.map(x=>(x[0]>0?x[0]+'kg×':'')+x[1]).join(' · ')}</div>`:''}
    ${rows}
    <div class="setadd">
      <button class="btn sm" data-act="setadd" data-n="${esc(name)}" data-x="${esc(id)}" data-rest="${restSec}"
        data-w="${preW}" data-r="${preR}">
        ${ic('check')} Serie făcută · pauză ${fmtTime(restSec)}</button>
      ${best?`<span class="hint mono">record estimat 1RM: ${best.v} kg</span>`:''}
    </div>
  </div>`;
}

/* ---------- planul de alergare, editabil de utilizator ----------
   Implicit: cifrele din program în S1 (4×6 threshold, 45 min steady la long run, 30 min easy),
   apoi progresia scrisă pe slide-uri: +1 repriză la threshold, +5 min la long run și la easy. */
const RUN_DEFAULT={
  ez1:{w:[30,30,35,35]},
  thr:{m:6, r:[4,5,6,6], rest:90},
  ez2:{w:[30,35,35,40]},
  lng:{w:[45,50,55,60]}
};
/* încălzire + răcire fixe, din program: threshold 10–15 + 10, long run 10–15 + 5–10 */
const RUN_WU={thr:22.5, lng:20};
function runPlan(){
  const saved=(S.runPlan||{}).h||{};
  const d=JSON.parse(JSON.stringify(RUN_DEFAULT));
  Object.keys(d).forEach(k=>{ if(saved[k]) Object.assign(d[k],saved[k]); });
  return d;
}
const mmss=v=>{ const t=Math.round(v*60); return Math.floor(t/60)+':'+String(t%60).padStart(2,'0'); };
function thrMin(p,w){ const r=p.thr.r[w]||0; return r?RUN_WU.thr+r*p.thr.m+Math.max(0,r-1)*p.thr.rest/60:0; }
function lngMin(p,w){ const m=p.lng.w[w]||0; return m?m+RUN_WU.lng:0; }
function runMinutes(w){
  const p=runPlan();
  const ez=(p.ez1.w[w]||0)+(p.ez2.w[w]||0), thr=thrMin(p,w), lng=lngMin(p,w);
  return {ez, thr, lng, total:ez+thr+lng};
}
/* ---------- jurnalul de alergări ---------- */
const RUN_KINDS=[['thr','Threshold','flame'],['ez','Easy Z2','wind'],['lng','Long run','activity']];
/* tipurile vechi rămân în hartă, ca alergările deja salvate să se afișeze corect */
const RUN_KMAP=Object.assign({int:['int','Intervale','zap'],tmp:['tmp','Tempo','flame']},
  Object.fromEntries(RUN_KINDS.map(k=>[k[0],k])));
const paceOf=r=>(r.km>0&&r.min>0)?r.min/r.km:null;
const fmtPace=p=>p==null?'—':mmss(p)+' /km';
/* minute și km alergați în ultimele 7 zile care se termină la data dată */
function runWeek(endKey){
  const from=dayShift(endKey,-6);
  const rows=(S.runs||[]).filter(r=>r.date>=from&&r.date<=endKey);
  return {min:rows.reduce((a,r)=>a+(+r.min||0),0),
          km: rows.reduce((a,r)=>a+(+r.km||0),0), n:rows.length};
}
/* seria de volum săptămânal, pe săptămâni calendaristice terminate luni */
function runWeeklySeries(){
  const rs=(S.runs||[]).slice().sort((a,b)=>a.date<b.date?-1:1);
  if(!rs.length) return [];
  const bucket={};
  rs.forEach(r=>{ const k=mondayOf(r.date);
    bucket[k]=bucket[k]||{km:0,min:0}; bucket[k].km+=(+r.km||0); bucket[k].min+=(+r.min||0); });
  return Object.keys(bucket).sort().map(k=>({k,km:bucket[k].km,min:bucket[k].min}));
}
/* regula de oprire: durere care crește a doua zi */
function painFlag(){
  const rs=(S.runs||[]).slice().sort((a,b)=>a.date<b.date?-1:1).slice(-6);
  const hurt=rs.filter(r=>(+r.pain||0)>=2);
  if(!hurt.length) return null;
  const last=hurt[hurt.length-1];
  return {date:last.date, n:hurt.length,
    msg:hurt.length>=2
      ? 'Ai bifat durere de nivel 2 sau 3 la '+hurt.length+' din ultimele '+rs.length+' alergări. Asta nu mai e oboseală, e un semnal. Scade volumul cu 30% sau ia o săptămână ușoară.'
      : 'Ai bifat durere de nivel 2 la ultima alergare ('+shortDate(last.date)+'). Dacă se repetă, scazi — nu crești.'};
}

/* ritmul folosit doar ca să traducem minutele în km orientativ */
const RUN_PACE=7.5;
function runKm(w){ return runMinutes(w).total/RUN_PACE; }
/* verificările care ies din cercetare, calculate pe cifrele LUI. Nu blochează nimic. */
function runWarnings(){
  const out=[];
  const km1=runKm(0);
  if(km1>3) out.push({lvl:'mid',t:'Săptămâna 1: ~'+km1.toFixed(0)+' km — ales conștient',
    d:'Pragul din studiul pe 749 de alergători începători: la IMC peste 30, peste 3 km în prima săptămână înseamnă +14 puncte procentuale risc de accidentare. Ai ales volumul din program de la început. Ce te protejează acum e regula de durere din Jurnalul de alergare.'});
  for(let w=1;w<CYC_WEEKS;w++){
    const prev=runMinutes(w-1).total, now=runMinutes(w).total;
    if(prev<=0) continue;
    const ch=(now-prev)/prev*100;
    if(ch>15) out.push({lvl:'bad',t:'S'+(w+1)+' sare cu '+ch.toFixed(0)+'%',
      d:'De la '+prev.toFixed(0)+' la '+now.toFixed(0)+' min pe săptămână. Programul adaugă 5–10 min sau o repriză; asta e mai mult.'});
    else if(ch>10) out.push({lvl:'mid',t:'S'+(w+1)+' crește cu '+ch.toFixed(0)+'%',
      d:'Puțin peste 10%. Merge, dar săptămâna aia nu mai crește nimic altceva.'});
  }
  for(let w=0;w<CYC_WEEKS;w++){
    const m=runMinutes(w), share=m.total?m.lng/m.total*100:0;
    if(share>45) out.push({lvl:'mid',t:'S'+(w+1)+': long run-ul e '+share.toFixed(0)+'% din volum',
      d:'Aproape jumătate din alergarea săptămânii într-o singură ieșire. Crește easy run-urile odată cu el.'});
  }
  return out;
}

/* ziua de test SRI nu mai e în program — probele se notează în Progres, când le faci */
function testDay(){ return BLOCKS[0].days[6]; }
function isDeload(w){ return false; }
/* zilele de alergare se scriu din planul lui, pentru săptămâna aleasă */
function dayFor(b,w,d){
  const day=BLOCKS[0].days[d];
  const lift=day.lift||[];
  if(!day.run){ return Object.assign({},day,{seg:lift.length?lift:[[day.k,day.min]]}); }
  const p=runPlan(), out=Object.assign({},day,{ex:day.ex.map(e=>e.slice())});
  const set=(re,txt)=>{ const row=out.ex.find(x=>re.test(x[0])); if(row) row[1]=txt; };
  let rm=0;
  if(day.run==='thr'){
    const r=p.thr.r[w]||0; rm=thrMin(p,w);
    set(/^Threshold/, r+' × '+mmss(p.thr.m)+' @ ritm de prag · pauză '+p.thr.rest+'s jog ușor');
    out.seg=[['hard',rm]];
  } else if(day.run==='lng'){
    const m=p.lng.w[w]||0; rm=lngMin(p,w);
    set(/^Long run/, m+' min continuu · ritm conversațional, zona 2');
    out.seg=[['easy',rm]];
  } else {
    const m=p[day.run].w[w]||0; rm=m;
    set(/^Easy run/, m+' min · ritm conversațional, zona 2'+(day.run==='ez2'?' — flush, nu antrenament':''));
    out.seg=[['easy',rm]].concat(lift);
  }
  out.min=Math.round(out.seg.reduce((a,x)=>a+x[1],0));
  return out;
}
/* ---------- scara de blocuri: ciclu curent + poartă ---------- */
function activeBlock(){ return Math.max(0,Math.min(S.curBlock||0,BLOCKS.length-1)); }
function shownBlock(){ return S.weekBlock==null?activeBlock():Math.max(0,Math.min(S.weekBlock,BLOCKS.length-1)); }
function cycOf(b){ return ((S.cyc||{}).h)||1; }
function curWeight(){
  const t=trend(); if(t&&t.last) return t.last;
  const a=weights(); if(a.length) return a[a.length-1].w;
  return nSet().startW;
}
// criteriile care deschid blocul următor; greutatea e criteriu recomandat, nu blocant
function gateStatus(b){
  const G=BLOCKS[b].gate; if(!G) return null;
  const t=latestFull(), w=curWeight();
  const items=[
    {k:'Pull-ups', ok:!!t&&t.pull>=G.pull,     cur:t?t.pull+' rep':'—',   need:'≥ '+G.pull+' rep'},
    {k:'Dips',     ok:!!t&&t.sprint>=G.sprint, cur:t?t.sprint+' rep':'—', need:'≥ '+G.sprint+' rep'},
    {k:'Push-ups', ok:!!t&&t.run>=G.run,       cur:t?t.run+' rep':'—',    need:'≥ '+G.run+' rep'}
  ];
  if(G.k1000){ const v=lastOf('k1000');
    items.push({k:'1000 m', ok:v!=null&&v<=G.k1000,
      cur:v!=null?fmtTime(v):'—', need:'≤ '+fmtTime(G.k1000)}); }
  if(G.s50){ const v=lastOf('s50');
    items.push({k:'50 m', ok:v!=null&&v<=G.s50,
      cur:v!=null?v.toFixed(2)+' s':'—', need:'≤ '+G.s50.toFixed(2)+' s'}); }
  const wItem={k:'Greutate',soft:true,ok:w<=G.w,cur:w.toFixed(1)+' kg',need:'≤ '+G.w+' kg'};
  const pass=items.every(x=>x.ok), missing=items.filter(x=>!x.ok).map(x=>x.k);
  return {items:items.concat([wItem]),pass,missing,hasTest:!!t,last:BLOCKS.length-1===b};
}
function mondayOf(k){ const d=new Date(k+'T00:00'); const off=(d.getDay()+6)%7; return dayShift(k,-off); }
function dayKey(b,w,d){ return 'hc'+cycOf(0)+'w'+w+'d'+d; }
function exId(b,w,d,x){ return dayKey(b,w,d)+'e'+x; }
function dayNum(b,w,d){ return w*CYC_DAYS+d+1; }
function daysTrained(){
  const log=S.wlog||{}; let n=0;
  for(const k in log){ if(Object.keys(log[k]||{}).some(x=>x!=='__min')) n++; }
  return n;
}
function dayDone(b,w,d,day){
  const log=(S.wlog||{})[dayKey(b,w,d)]||{};
  let n=0; day.ex.forEach((_,x)=>{ if(log[exId(b,w,d,x)]) n++; });
  return n;
}
function dayFull(b,w,d,day){ return day.ex.length>0 && dayDone(b,w,d,day)===day.ex.length; }
// ziua curentă = prima neterminată din bloc
function nextDay(b){
  const B=BLOCKS[b];
  for(let w=0;w<B.weeks;w++) for(let d=0;d<B.days.length;d++)
    if(!dayFull(b,w,d,dayFor(b,w,d))) return {w,d};
  return {w:B.weeks-1,d:B.days.length-1};
}

function globalDay(){ const b=activeBlock(), nx=nextDay(b); return dayNum(b,nx.w,nx.d); }

/* ---------- utilitare de dată ---------- */
const daysBetween=(a,b)=>Math.round((new Date(b+'T00:00')-new Date(a+'T00:00'))/864e5);
const monthLabel=k=>new Date(k+'T00:00').toLocaleDateString('ro-RO',{month:'long',year:'numeric'});
function weightAt(d){ const a=weights(); if(!a.length) return null; let best=a[0];
  a.forEach(x=>{ if(Math.abs(daysBetween(x.d,d))<Math.abs(daysBetween(best.d,d))) best=x; }); return best.w; }

/* ---------- predicția pentru 1000 m ----------
   Două pârghii: greutatea (aceeași capacitate aerobă, împărțită la mai puține kilograme → timpul scade
   proporțional cu masa) și antrenamentul (câștig care se aplatizează în timp). Cu două teste la peste
   4 săptămâni distanță, câștigul din antrenament se calibrează pe tine. */
const PJ_TAU=20;
/* ritmul real de slăbit: regresie liniară pe cântăririle din ultimele 28 de zile, în kg/săptămână */
function weightRate(){
  const tk=todayKey(), a=weights().filter(x=>daysBetween(x.d,tk)<=28);
  if(a.length<4||daysBetween(a[0].d,a[a.length-1].d)<10) return null;
  const xs=a.map(x=>daysBetween(a[0].d,x.d)), ys=a.map(x=>x.w), n=a.length;
  const mx=xs.reduce((p,c)=>p+c,0)/n, my=ys.reduce((p,c)=>p+c,0)/n;
  let num=0,den=0; xs.forEach((x,i)=>{ num+=(x-mx)*(ys[i]-my); den+=(x-mx)*(x-mx); });
  return den?num/den*7:null;
}
function kmTests(){ return (S.tests||[]).filter(t=>t.k1000!=null&&t.k1000!==''&&t.date).map(t=>({d:t.date,t:+t.k1000,w:weightAt(t.date)||curWeight()}))
  .sort((a,b)=>a.d<b.d?-1:1); }
function predict1000(){
  const T=kmTests(), tk=todayKey(), n=nSet();
  let anchor, declared=false, g=0.10, calib=false, weeksSinceFirst=0;
  if(T.length){ anchor=T[T.length-1]; } else { anchor={d:tk,t:260,w:curWeight()}; declared=true; }
  if(T.length>=2){ const f=T[0], l=T[T.length-1], dw=daysBetween(f.d,l.d)/7;
    if(dw>=4){ const rho=l.t/(f.t*(l.w/f.w)), k=1-Math.exp(-dw/PJ_TAU);
      g=Math.max(0.02,Math.min(0.25,(1-rho)/k)); calib=true; weeksSinceFirst=dw; } }
  const gRem=g*Math.exp(-weeksSinceFirst/PJ_TAU);
  const wr=weightRate(); let rate=(wr!=null&&wr<-0.05)?Math.min(1.2,Math.max(0.2,-wr)):(+n.rate||0.6);
  const Wnow=curWeight(), goal=+n.goalW||105, wa=daysBetween(anchor.d,tk)/7;
  const at=(x,gg,rr)=>{ const W=Math.max(goal,Wnow-rr*x), xa=wa+x; return anchor.t*(W/anchor.w)*(1-gg*(1-Math.exp(-xa/PJ_TAU))); };
  const find=(gg,rr)=>{ for(let x=0;x<=156;x++) if(at(x,gg,rr)<=KM[10]) return x; return null; };
  const cases={mid:[gRem,rate],opt:[gRem*1.4,rate*1.2],pes:[gRem*0.5,rate*0.7]};
  const hit={}; Object.keys(cases).forEach(k=>{ hit[k]=find(...cases[k]); });
  const horizon=Math.min(104,Math.max(26,(hit.pes!=null?hit.pes:hit.mid!=null?hit.mid:52)+6));
  const pts=[]; for(let x=0;x<=horizon;x+=1) pts.push({x,mid:at(x,...cases.mid),opt:at(x,...cases.opt),pes:at(x,...cases.pes)});
  return {anchor,declared,calib,g,rate,Wnow,goal,hit,pts,horizon,tests:T,now:at(0,...cases.mid),
    in9:at(39,...cases.mid), dateOf:x=>x==null?null:dayShift(tk,Math.round(x*7))};
}
function projSVG(P){
  const W=680,H=380,ml=74,mr=16,mt=26,mb=44, xs=P.horizon;
  const all=P.pts.map(p=>[p.opt,p.pes]).flat().concat([KM[10],P.anchor.t]);
  let lo=Math.min(...all)-6, hi=Math.max(...all)+6;
  const X=x=>ml+x/xs*(W-ml-mr), Y=v=>mt+(v-lo)/(hi-lo)*(H-mt-mb);
  let g='';
  for(let i=0;i<=3;i++){ const v=lo+(hi-lo)*i/3; g+=`<line class="g" x1="${ml}" x2="${W-mr}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}"/>
    <text class="ax" x="${ml-6}" y="${(Y(v)+3).toFixed(1)}" text-anchor="end">${fmtTime(v)}</text>`; }
  for(let m=0;m<=xs;m+=Math.max(4,Math.round(xs/6/4)*4)){ const d=new Date(dayShift(todayKey(),m*7)+'T00:00');
    g+=`<text class="ax" x="${X(m).toFixed(1)}" y="${H-12}" text-anchor="middle">${d.toLocaleDateString('ro-RO',{month:'short'}).replace('.','')}</text>`; }
  const band=P.pts.map(p=>`${X(p.x).toFixed(1)},${Y(p.opt).toFixed(1)}`).join(' ')+' '+P.pts.slice().reverse().map(p=>`${X(p.x).toFixed(1)},${Y(p.pes).toFixed(1)}`).join(' ');
  const mid=P.pts.map((p,i)=>`${i?'L':'M'}${X(p.x).toFixed(1)} ${Y(p.mid).toFixed(1)}`).join(' ');
  const ty=Y(KM[10]);
  const past=P.tests.map(t=>{ const x=daysBetween(todayKey(),t.d)/7; return x>=-0.5?`<circle class="pt" cx="${X(Math.max(0,x)).toFixed(1)}" cy="${Y(t.t).toFixed(1)}" r="8"/>`:''; }).join('');
  const hx=P.hit.mid!=null&&P.hit.mid<=xs?`<circle class="hit" cx="${X(P.hit.mid).toFixed(1)}" cy="${ty.toFixed(1)}" r="9"><animate attributeName="r" values="9;14;9" dur="1.6s" repeatCount="indefinite"/></circle>`:'';
  return `<svg class="pj" viewBox="0 0 ${W} ${H}">${g}<polygon class="band" points="${band}"/>
    <line class="tg" x1="${ml}" x2="${W-mr}" y1="${ty.toFixed(1)}" y2="${ty.toFixed(1)}"/><text class="tgl" x="${W-mr}" y="${(ty-10).toFixed(1)}" text-anchor="end">3:20 · nota 10</text>
    <path class="mid" pathLength="1" d="${mid}"/>${past}${hx}</svg>`;
}
function predictPanel(){
  const P=predict1000(), dm=P.dateOf(P.hit.mid), dO=P.dateOf(P.hit.opt), dP=P.dateOf(P.hit.pes);
  return `<div class="panel"><div class="panel-t">${ic('target')} Predicție · 1000 m în 3:20</div>

      <p class="muted" style="margin-top:8px">Modelul are două pârghii. <b>Greutatea</b>: capacitatea aerobă rămâne cam aceeași când slăbești, dar o
      împarți la mai puține kilograme, deci timpul scade proporțional cu masa — ritmul de slăbit vine din cântărirea ta
      (${P.rate.toFixed(2)} kg/săpt., până la ${P.goal} kg). <b>Antrenamentul</b>: un câștig care se aplatizează în timp,
      ${P.calib?`calibrat pe testele tale la ${(P.g*100).toFixed(0)}% potențial total`:'estimat la 10% potențial până la calibrare'}.
      Banda arată cazul bun și cazul prudent. ${P.calib?'':'Cu două teste la peste 4 săptămâni distanță, predicția se calibrează pe tine.'}
      E o estimare, nu o promisiune — se mută în fiecare săptămână odată cu datele.</p></details>
    <button class="btn ghost sm" data-act="goTest" style="margin-top:10px">${ic('plus')} Adaugă un test de 1000 m</button>
  </div>`;
}

/* ---------- detector de stagnare ---------- */
function stalls(){
  const out=[], L=S.lifts||{}, tk=todayKey();
  Object.keys(L).forEach(nm=>{
    const ses=(L[nm]||[]).map(x=>({d:x.d,b:Math.max(0,...x.s.map(([w,r])=>e1rm(w,r)))})).filter(x=>x.b>0);
    if(ses.length<3) return;
    let best=0,bestD=null; ses.forEach(x=>{ if(x.b>best){best=x.b;bestD=x.d;} });
    const since=daysBetween(bestD,tk), after=ses.filter(x=>x.d>bestD).length, last=ses[ses.length-1];
    if(since>=21&&after>=2&&daysBetween(last.d,tk)<=21) out.push({nm,best,bestD,since,after,lastB:last.b});
  });
  return out.sort((a,b)=>b.since-a.since);
}
function stallTips(st){
  const drop=st.lastB<st.best*0.95;
  return [drop?'Ultima sesiune e sub record cu peste 5% — oboseală, nu lipsă de stimul. O săptămână la −10% greutate pe exercițiul ăsta, apoi reconstruiești.'
              :'Schimbă intervalul de repetări pentru 2–3 săptămâni (de ex. 5×5 în loc de 4×6–8), apoi revii.',
    'Verifică somnul și turele din ultimele 3 săptămâni — după nopți, forța scade înaintea oricărui alt semn.',
    'Verifică proteina și energia disponibilă din Nutriție — sub 30 kcal/kg masă slabă, forța nu mai urcă.',
    /Deadlift|Hack Squat|Hip Thrust/.test(st.nm)?'La exercițiile pe spate nu forța recordul: filmează o serie și verifică dacă spatele rămâne neutru.':'Filmează o serie: adesea greutatea stagnează pentru că amplitudinea s-a scurtat pe nesimțite.'];
}
function stallPanel(){
  const S2=stalls(); if(!S2.length) return '';
  return `<div class="panel"><div class="panel-t">${ic('shield')} Stagnare</div>
    <p class="muted">Exercițiile fără record de peste 3 săptămâni, deși le-ai făcut de cel puțin două ori de atunci.</p>
    ${S2.map(st=>`<div class="stall"><b>${esc(st.nm)}</b>
      <div class="m">record ${st.best} kg 1RM · ${dayLabel(st.bestD)} · de ${Math.floor(st.since/7)} săpt. · ${st.after} sesiuni fără progres</div>
      <ul>${stallTips(st).map(t=>`<li>${t}</li>`).join('')}</ul></div>`).join('')}
  </div>`;
}

function defShoe(){ const a=(S.shoes||[]).filter(x=>!x.retired); return a.find(x=>x.def)||a[0]||null; }

/* ---------- compoziția corporală — formula US Navy (talie + gât + înălțime) ---------- */
function navyBF(waist,neck,h){ const w=waist/2.54,n=neck/2.54,hh=h/2.54; if(!(w-n>0)) return null;
  return 86.010*Math.log10(w-n)-70.041*Math.log10(hh)+36.76; }
function bodySeries(){ const B=S.body||{}, h=+nSet().h||200;
  return Object.keys(B).sort().map(d=>{ const x=B[d], bf=navyBF(+x.waist,+x.neck,h), w=weightAt(d)||curWeight();
    return bf==null?null:{d,waist:+x.waist,neck:+x.neck,bf,w,fat:w*bf/100,lean:w*(1-bf/100)}; }).filter(Boolean); }
function measuredBF(){ const s=bodySeries(), l=s[s.length-1]; return l&&daysBetween(l.d,todayKey())<=45?l.bf:null; }
function bodyPanel(){
  const bs=bodySeries(), l=bs[bs.length-1], f=bs[0];
  let delta='';
  if(bs.length>=2){ const dW=l.w-f.w, dF=l.fat-f.fat, dL=l.lean-f.lean;

/* ---------- forța pe fiecare exercițiu: 1RM estimat pe sesiune + recorduri ---------- */
function liftPanel(){
  const L=S.lifts||{};
  const names=Object.keys(L).filter(n=>(L[n]||[]).some(x=>x.s.some(y=>y[0]>0)))
    .sort((a,b)=>{ const la=L[a][L[a].length-1].d, lb=L[b][L[b].length-1].d; return la<lb?1:la>lb?-1:0; });
  if(!names.length) return `<div class="panel"><div class="panel-t">${ic('trend')} Forță pe exercițiu</div>
    <div class="empty"><p>Graficul apare după primele serii cu greutate.</p>
    <button class="btn solid sm" data-act="tab" data-k="workout">${ic('dumbbell')} Deschide Workout</button></div></div>`;
  const sel=names.indexOf(S.liftSel)>=0?S.liftSel:names[0];
  const ses=(L[sel]||[]).map(x=>{ let best=0,top=null; x.s.forEach(([w,r])=>{ const e=e1rm(w,r); if(e>best){best=e;top=[w,r];} });
    return {d:x.d,best,top,n:x.s.length}; }).filter(x=>x.best>0);
  let run=0; ses.forEach(x=>{ x.pr=x.best>run&&run>0; if(x.best>run) run=x.best; });
  const rec=Math.max(...ses.map(x=>x.best)), recS=ses.filter(x=>x.best===rec).pop();
  const first=ses[0], lastS=ses[ses.length-1], gain=lastS.best-first.best;
  const chart=ses.length>1?lineChart(ses.map(x=>x.best),{target:rec,reversed:false,fmt:v=>Math.round(v)+'',
    labels:ses.map(x=>shortDate(x.d)),tlabel:'record'}):'';
  return `<div class="panel"><div class="panel-t">${ic('trend')} Forță pe exercițiu</div>
    <div class="lchips" style="margin-top:10px">${names.map(n=>`<button class="chip ${n===sel?'on':''}" data-act="liftSel" data-k="${esc(n)}">${esc(n)}</button>`).join('')}</div>
    <div class="stats" style="grid-template-columns:repeat(3,minmax(0,1fr));margin-top:14px">
      <div class="stat"><div class="k">RECORD 1RM</div><div class="v"><span data-cnt="${rec}">${rec}</span><small>kg</small></div>
        <div class="k" style="margin-top:4px">${dayLabel(recS.d)}</div></div>
      <div class="stat"><div class="k">ULTIMA SERIE TOP</div><div class="v">${lastS.top[0]}<small>× ${lastS.top[1]}</small></div>
        <div class="k" style="margin-top:4px">${dayLabel(lastS.d)}</div></div>
      <div class="stat"><div class="k">DE LA PRIMA</div><div class="v" style="color:${gain>0?'var(--accent-hi)':'var(--mute)'}">${gain>0?'+':''}${gain}<small>kg</small></div>
        <div class="k" style="margin-top:4px">${ses.length} ${ses.length===1?'sesiune':'sesiuni'}</div></div>
    </div>
    ${chart?`<div style="margin-top:16px"><div class="hint" style="margin-bottom:6px">1RM estimat pe sesiune (Epley) — linia de sus e recordul.</div>${chart}</div>`
      :`<p class="muted" style="margin-top:14px">Graficul apare de la a doua sesiune.</p>`}
    <div class="scroll-x" style="margin-top:14px"><table class="tbl"><thead><tr><th>Data</th><th>Serii</th><th>Top</th><th>1RM</th></tr></thead><tbody>
      ${ses.slice().reverse().slice(0,12).map((x,i)=>`<tr style="--i:${i}"><td>${shortDate(x.d)}</td><td>${x.n}</td><td>${x.top[0]} × ${x.top[1]}</td>
        <td>${x.best}${x.pr?' <span class="prb">PR</span>':''}</td></tr>`).join('')}
    </tbody></table></div>
  </div>`;
}

/* ---------- pauze & cronometru de sesiune ---------- */
function parseRest(detail,name){
  const t=(detail||'').toLowerCase();
  let m=t.match(/pauz[ăa]\s*(?:activ[ăa]\s*)?(\d+)\s*min/);      if(m) return +m[1]*60;
  m=t.match(/pauz[ăa]\s*(?:de\s*)?(\d+)\s*[–-]?\s*(\d+)?\s*s/); if(m) return +m[1];
  m=t.match(/pauz[ăa]\s*(\d+):(\d+)/);                            if(m) return +m[1]*60+ +m[2];
  if(/pauz[ăa]\s*complet|recuperare complet/.test(t)) return 240;
  const n=(name||'').toLowerCase();
  if(/încălzire|incalzire|warm up|cool[ -]?down|mobilitate|mobility|stretching|foam|somn|mers|drill|notează|respirație|breathing|reset|alergare|zona 2|alergat|bicicletă|run|threshold|walk|bike|emom|finisher|conditioning/.test(n)) return 0;
  if(/weighted|negative|nordic|front lever|planche/.test(n)) return 180;
  if(/maxim|la eșec|test/.test(n)) return 180;

function restWav(sec){
  const sr=8000, n=Math.round((sec+1.2)*sr), buf=new Uint8Array(44+n);

  wr(0,'RIFF'); dv.setUint32(4,36+n,true); wr(8,'WAVE'); wr(12,'fmt ');
  dv.setUint32(16,16,true); dv.setUint16(20,1,true); dv.setUint16(22,1,true);
  dv.setUint32(24,sr,true); dv.setUint32(28,sr,true); dv.setUint16(32,1,true); dv.setUint16(34,8,true);
  wr(36,'data'); dv.setUint32(40,n,true); buf.fill(128,44);
  const tone=(t0,dur,f)=>{ const a=Math.round(t0*sr), b=Math.min(n,Math.round((t0+dur)*sr));
    for(let i=Math.max(0,a);i<b;i++){ const t=(i-a)/sr, env=Math.min(1,t/.01,(dur-t)/.02);

function ensureDock(){
  document.body.classList.toggle('has-dock',!!(S.sess||S.rest));
  let d=document.getElementById('dock');
  if(!(S.sess||S.rest)){ if(d) d.remove(); stopDock(); return; }
  if(!d){ d=document.createElement('div'); d.className='dock'; d.id='dock'; document.body.appendChild(d); }
  if(!dockHandle) dockHandle=setInterval(dockTick,500);
}
function stopDock(){ if(dockHandle){clearInterval(dockHandle);dockHandle=null;} }
function dockTick(){
  const si=document.getElementById('sessInline'); if(si&&S.sess) si.textContent=fmtTime(sessElapsed());
  if(S.rest){
    const left=restLeft(), bgPlaying=S.rest.bg&&restAudio&&!restAudio.paused;
    if(left<=3&&left>0&&left<S.rest.beeped){ S.rest.beeped=left; if(!bgPlaying&&!document.hidden) beep(880,.06); }
    if(left<=0){ endRest(false); return; }
  }
  paintDock(); paintFocusLive();
}
function paintDock(){
  const d=document.getElementById('dock'); if(!d) return;
  d.classList.toggle('urgent',!!S.rest&&restLeft()<=3);
  const R=16,C=2*Math.PI*R;
  let html='<div class="dock-in">';
  if(S.sess){
    html+=`<div class="dock-blk">${ic('timer')}<div>
      <div class="dock-k">ANTRENAMENT</div>
      <div class="dock-v mono">${fmtTime(sessElapsed())}</div></div></div>`;
  }
  if(S.rest){
    if(S.sess) html+='<div class="dock-sep"></div>';
    const rl=restLeft(), frac=rl/S.rest.total;
    html+=`<div class="dock-blk">
      <svg class="dock-ring" viewBox="0 0 38 38" aria-hidden="true">
        <circle cx="19" cy="19" r="${R}" fill="none" stroke="rgba(185,201,217,.14)" stroke-width="3"/>
        <circle cx="19" cy="19" r="${R}" fill="none" stroke="var(--signal)" stroke-width="3"
          stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-frac)}"
          transform="rotate(-90 19 19)" style="transition:stroke-dashoffset .9s linear"/>
      </svg>
      <div><div class="dock-k">PAUZĂ</div>
      <div class="dock-v rest mono">${fmtTime(rl)}</div></div></div>`;
  }
  html+='<div class="dock-acts">';
  if(S.rest) html+=`<button class="btn ghost sm" data-act="restAdd">+30s</button><button class="btn ghost sm" data-act="restStop">Sari</button>`;
  if(S.sess) html+=`<button class="btn solid sm" data-act="sessStop">Termină</button>`;
  html+='</div></div>';
  d.innerHTML=html;
}

const COLLAPSE_TABS={workout:1,nutri:1,progress:1,tools:1,azi:1};
function collapseLong(root){
  if(!COLLAPSE_TABS[S.tab]) return;
  root.querySelectorAll('.panel p.muted, .panel .hint').forEach(el=>{
    if(el.closest('details,.setlog,.fx-in,.cntbox,.stat,.plates-t')||el.querySelector('input,button,select,svg')) return;
    const txt=el.textContent.replace(/\s+/g,' ').trim(); if(txt.length<190) return;
    const m=txt.match(/^(.{25,150}?[.!?])\s/); const head=m?m[1]:txt.slice(0,110).replace(/\s\S*$/,'')+'…';
    const d=document.createElement('details'); d.className='why';
    const sm=document.createElement('summary'); const sp=document.createElement('span'); sp.className='wh'; sp.textContent=head; sm.appendChild(sp);
    el.parentNode.insertBefore(d,el); d.appendChild(sm); d.appendChild(el);
  });
}

/* numere care urcă de la zero, doar la intrarea în filă */
function countUp(root){
  root.querySelectorAll('[data-cnt]').forEach(el=>{
    const to=parseFloat(el.dataset.cnt); if(!isFinite(to)) return;
    const dec=+el.dataset.dec||0, dur=720, t0=performance.now();
    const step=now=>{ const k=Math.min(1,(now-t0)/dur), e=1-Math.pow(1-k,3);
      el.textContent=(to*e).toFixed(dec); if(k<1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  });
}
function applyBg(){
  const el=document.getElementById('bglayer'); if(!el) return;
  el.style.backgroundImage=S.bgImg?`url(${S.bgImg})`:'none';
  el.style.opacity=S.bgImg?((+S.bgOp||16)/100):0;
  const ib=document.querySelector('.intro-bg');
  if(ib) ib.style.backgroundImage=S.bgImg?`url(${S.bgImg})`:'none';
}

/* ---------- cronometru ---------- */
function beep(freq=1100,dur=.09){
  try{
    audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
    const o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.type='triangle'; o.frequency.value=freq;
    g.gain.setValueAtTime(.0001,audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(.25,audioCtx.currentTime+.01);
    g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime+dur+.02);
  }catch(e){}
}
function timerPaint(){
  const T=S.timer, cfg=TPRESETS[T.cfg];
  const el=document.getElementById('tLeft'); if(!el) return;
  const totalP=T.phase==='work'?cfg.work:T.phase==='rest'?cfg.rest:T.phase==='prep'?cfg.prep:1;
  const frac=(T.phase==='idle'||T.phase==='done')?0:T.left/totalP;
  const C=2*Math.PI*100;
  const col=T.phase==='work'?'var(--signal)':T.phase==='rest'?'var(--ok)':T.phase==='done'?'var(--ok)':'var(--mute2)';
  el.textContent=fmtTime(T.left);
  const ring=document.getElementById('tRing');
  if(ring){ring.setAttribute('stroke-dashoffset',C*(1-frac));ring.setAttribute('stroke',col);}
  const ph=document.getElementById('tPhase');
  if(ph){ph.textContent={work:'EFORT',rest:'PAUZĂ',prep:'PREGĂTIRE',done:'GATA',idle:'STANDBY'}[T.phase];
    ph.style.color=col; ph.classList.toggle('pulsing',T.running&&T.phase==='work');}
  const rd=document.getElementById('tRound');
  if(rd) rd.textContent=(T.phase==='idle'||T.phase==='done')?cfg.rounds+' reprize':'repriza '+T.round+' / '+cfg.rounds;
}
function timerTick(){
  const T=S.timer, cfg=TPRESETS[T.cfg];
  if(T.left>1){ T.left--; if(T.left<=3) beep(880,.06); timerPaint(); return; }
  if(T.phase==='prep'){ T.phase='work'; T.left=cfg.work; T.round=1; beep(1320,.12); }
  else if(T.phase==='work'){
    if(T.round>=cfg.rounds){ T.phase='done'; T.left=0; T.running=false; stopTimer();
      beep(660,.12); setTimeout(()=>beep(520,.12),150); setTimeout(()=>beep(392,.25),300); render(); return; }
    T.phase='rest'; T.left=cfg.rest; beep(980,.08);
  } else if(T.phase==='rest'){ T.phase='work'; T.left=cfg.work; T.round++; beep(1320,.12); }
  timerPaint();
}
function startTimer(){
  const T=S.timer, cfg=TPRESETS[T.cfg];
  try{ audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
       if(audioCtx.state==='suspended') audioCtx.resume(); }catch(e){}
  if(T.phase==='idle'||T.phase==='done'){ T.phase='prep'; T.left=cfg.prep; T.round=0; }
  T.running=true; stopTimer(); tickHandle=setInterval(timerTick,1000); render();
}
function stopTimer(){ if(tickHandle){clearInterval(tickHandle);tickHandle=null;} }

async function save(key,val,prop){ S[prop]=val; await store.set(key,val); }

document.addEventListener('change',async ev=>{
  const el=ev.target.closest('[data-act="planSet"]'); if(!el) return;
  const key=el.dataset.k, f=el.dataset.f, idx=el.dataset.i;
  const cur=runPlan(), v=Math.max(0,+el.value||0);
  if(f==='m') cur[key].m=Math.max(0.5,v);
  else if(f==='rest') cur[key].rest=v;
  else if(f==='r'){ cur[key].r=cur[key].r.slice(); cur[key].r[+idx]=v; }
  else if(f==='w'){ cur[key].w=cur[key].w.slice(); cur[key].w[+idx]=v; }
  const pl=Object.assign({},S.runPlan||{}); pl.h=cur;
  await save('zece:runPlan',pl,'runPlan'); render();
});

  if(a==='restStop'){ endRest(true); render(); return; }
  if(a==='restAdd'){ if(S.rest){ S.rest.endAt+=30000; S.rest.total+=30; startRest(restLeft(),S.rest.label); } render(); return; }
  if(a==='bgSound'){ await save('zece:bgSound',S.bgSound===false,'bgSound'); render(); return; }
  if(a==='cntInc'||a==='cntDec'){ const nm=el.dataset.n;
    await setCount(nm, cntToday(nm)+(a==='cntInc'?1:-1)); justCnt=nm; render(); return; }
  if(a==='wuTick'){ S.wuDone=Object.assign({},S.wuDone||{}); S.wuDone[k]=!S.wuDone[k]; render(); return; }
  if(a==='liftSel'){ S.liftSel=k; render();
    const c=document.querySelector('#view .lchips'); if(c){ const p=c.closest('.panel'); if(p){ p.classList.remove('pop'); void p.offsetWidth; } }
    return; }
  if(a==='sessStart'){ unlockAudio(); keepAwake(true); S.sess={date:k,start:Date.now()};
    const pp=dkParts(k); if(pp) S.focus={dk:k,w:pp.w,d:pp.d,i:firstUndone(k,pp.w,pp.d),dir:'',tw:null,tr:null};
    await store.set('zece:sess',S.sess); ensureDock(); paintDock(); render(); return; }
  if(a==='focusOpen'){ unlockAudio(); const pp=dkParts(k); if(pp) S.focus={dk:k,w:pp.w,d:pp.d,i:firstUndone(k,pp.w,pp.d),dir:'',tw:null,tr:null};
    render(); return; }
  if(a==='focusClose'){ S.focus=null; render(); return; }
  if(a==='fxNext'||a==='fxPrev'){ fxMove(a==='fxNext'?1:-1); return; }
  if(a==='fxSum'){ if(S.focus){ S.focus.summary=true; S.focus.dir='r'; } renderFocus(); return; }
  if(a==='fxW'||a==='fxR'){ const f=S.focus; if(!f) return; const e=dayFor(0,f.w,f.d).ex[f.i], T=fTarget(e[0],e[1]);
    if(a==='fxW') f.tw=Math.max(0,Math.round(((f.tw!=null?f.tw:T.w)+(+i)*wStep(e[0]))*100)/100);
    else f.tr=Math.max(1,(f.tr!=null?f.tr:T.r)+(+i));
    renderFocus(); return; }
  if(a==='fxSet'){ const f=S.focus; if(!f) return; const day=dayFor(0,f.w,f.d), e=day.ex[f.i], id=exId(0,f.w,f.d,f.i);
    const T=fTarget(e[0],e[1]), w=f.tw!=null?f.tw:T.w, r=f.tr!=null?f.tr:T.r;
    startRest(parseRest(e[1],e[0])||90,id);
    await addSet(e[0],w,r); f.tw=w; f.tr=r;
    if(T.today.length+1>=T.sc.sets&&!((S.wlog||{})[f.dk]||{})[id]){ await setTick(f.dk,id,true); justEx=id; }
    render(); checkPR(e[0]); return; }
  if(a==='fxDone'){ const f=S.focus; if(!f) return; const day=dayFor(0,f.w,f.d), id=exId(0,f.w,f.d,f.i);
    if(!((S.wlog||{})[f.dk]||{})[id]) await setTick(f.dk,id,true);
    const log=(S.wlog||{})[f.dk]||{}, left=day.ex.findIndex((_,j)=>!log[exId(0,f.w,f.d,j)]);
    if(left<0){ f.summary=true; f.dir='r'; try{ navigator.vibrate&&navigator.vibrate([40,30,40,30,90]); }catch(e){} beep(880,.07); setTimeout(()=>beep(1175,.07),90); setTimeout(()=>beep(1568,.14),180); }
    else { f.i=f.i<day.ex.length-1?f.i+1:left; f.dir='r'; f.tw=f.tr=null; }
    render(); return; }
  if(a==='sessStop'){
    if(S.sess){ const pp=dkParts(S.sess.date), mins0=Math.max(1,Math.round(sessElapsed()/60));
      if(pp) S.focus={dk:S.sess.date,w:pp.w,d:pp.d,i:0,summary:true,mins:mins0,dir:''}; }
    if(S.sess){ const mins=Math.max(1,Math.round(sessElapsed()/60));
      const log=Object.assign({},S.wlog||{});
      log[S.sess.date]=Object.assign({},log[S.sess.date]||{},{__min:mins});
      S.sess=null; keepAwake(false); await store.set('zece:sess',null); await save('zece:wlog',log,'wlog'); }
    ensureDock(); render(); return; }
  if(a==='logMeal'){ const m=MEALS[+k]; const ml=Object.assign({},S.mlog||{});
    ml[tk]=(ml[tk]||[]).concat([{n:m[1],k:m[2],p:m[3],c:m[4],g:m[5]}]);
    await save('zece:mlog',ml,'mlog'); render(); return; }
  if(a==='unlogMeal'){ const ml=Object.assign({},S.mlog||{});
    ml[tk]=(ml[tk]||[]).filter((_,j)=>j!==+i);
    await save('zece:mlog',ml,'mlog'); render(); return; }
  if(a==='logCustom'){ const g=id=>document.getElementById(id);
    const nm=(g('cN').value||'').trim(), kk=+g('cK').value||0;
    if(!nm||!kk) return;
    const ml=Object.assign({},S.mlog||{});
    ml[tk]=(ml[tk]||[]).concat([{n:nm,k:kk,p:+g('cP').value||0,c:+g('cC').value||0,g:+g('cG').value||0}]);
    await save('zece:mlog',ml,'mlog'); render(); return; }
  if(a==='mslot'){ S.mOpen=S.mOpen===+i?-1:+i; render(); return; }
  if(a==='mfilter'){ S.mFilter=!S.mFilter; render(); return; }
  if(a==='wAdd'){ const val=parseFloat(document.getElementById('wIn').value);
    if(val>30&&val<300){ const w=Object.assign({},S.weights||{}); w[tk]=Math.round(val*10)/10;
      await save('zece:weights',w,'weights'); } render(); return; }
  if(a==='applyCut'){ const T=targets(), n=nSet();
    await save('zece:nutri',Object.assign({},n,{manual:T.kcal-(+i)}),'nutri'); render(); return; }
  if(a==='clearManual'){ await save('zece:nutri',Object.assign({},nSet(),{manual:null}),'nutri'); render(); return; }
  if(a==='wreset'){ const bb=shownBlock(), B=BLOCKS[bb], wk=(S.wWeek==null)?nextDay(bb).w:S.wWeek;
    const log=Object.assign({},S.wlog||{});
    B.days.forEach((_,d)=>{ const k2=dayKey(S.weekBlock,wk,d), keep=(log[k2]||{}).__min;
      if(keep) log[k2]={__min:keep}; else delete log[k2]; });
    await save('zece:wlog',log,'wlog'); render(); return; }

  if(a==='addTest'){
    const run=+document.getElementById('tM').value||0;
    const sp=document.getElementById('tSp').value, pu=document.getElementById('tPu').value;
    const kmRaw=(document.getElementById('tKm').value||'').trim();
    const s5=document.getElementById('tS5').value;
    /* 1000 m: acceptă „4:35", „4.35" sau secunde brute */
    let km=null;
    if(kmRaw){ const m=kmRaw.match(/^(\d+)\s*[:.]\s*(\d{1,2})$/);
      km=m?(+m[1]*60+ +m[2]):(+kmRaw||null);
      if(km!=null&&km<40) km=null; }
    if(!run&&!sp&&!pu&&km==null&&!s5) return;
    const next=S.tests.concat([{date:tk,run:run||null,sprint:sp?+sp:null,pull:pu?+pu:null,
      k1000:km,s50:s5?+s5:null}]);
    await save('zece:tests',next,'tests'); render(); return; }
  if(a==='delTest'){ await save('zece:tests',S.tests.filter((_,j)=>j!==+i),'tests'); render(); return; }

  if(a==='logWo'){ const w=S.workouts||{}, entries=(w.entries||[]).concat([
      {eid:Date.now()+'-'+Math.random().toString(36).slice(2,6),sid:k,date:tk,note:''}]);
    await save('zece:workouts',Object.assign({},w,{entries}),'workouts'); render(); return; }
  if(a==='delWo'){ const w=S.workouts||{};
    await save('zece:workouts',Object.assign({},w,{entries:(w.entries||[]).filter(e=>e.eid!==k)}),'workouts');
    render(); return; }
});

document.addEventListener('input',ev=>{
  const t=ev.target;
  if(t.id==='paceM'){ S.paceM=t.value; refreshPace(); }
  if(t.id==='paceS'){ S.paceS=t.value; refreshPace(); }
  if(t.id==='nAge'||t.id==='nH'||t.id==='nBf'){
    const key={nAge:'age',nH:'h',nBf:'bf'}[t.id], v=+t.value;
    clearTimeout(nutTimer);
    nutTimer=setTimeout(async()=>{
      if(!isFinite(v)||v<=0) return;
      await save('zece:nutri',Object.assign({},nSet(),{[key]:v}),'nutri');
      if(S.tab==='nutri') render();
    },800);
  }
});
let nutTimer=null;
let paceTimer=null;
function refreshPace(){ clearTimeout(paceTimer); paceTimer=setTimeout(()=>{ if(S.tab==='tools') render(); },600); }

document.addEventListener('change',async ev=>{
  const t=ev.target;
  if(t.id==='bgFile' && t.files && t.files[0]){
    try{
      const url=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(t.files[0]);});
      const img=new Image();
      await new Promise((res,rej)=>{img.onload=res;img.onerror=rej;img.src=url;});
      const sc=Math.min(1,1000/Math.max(img.width,1));
      const c=document.createElement('canvas');
      c.width=Math.max(1,Math.round(img.width*sc)); c.height=Math.max(1,Math.round(img.height*sc));
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      await save('zece:bg',c.toDataURL('image/jpeg',0.7),'bgImg');
      render();
    }catch(e){ alert('Nu am putut citi imaginea.'); }
    return;
  }
  if(t.dataset && t.dataset.cntx){ await setCount(t.dataset.cntx,t.value); render(); return; }
  if(t.dataset && t.dataset.setedit){
    const nm=liftKey(t.dataset.setedit), L=Object.assign({},S.lifts||{});
    const h=(L[nm]||[]).slice(), cur=h[h.length-1];
    if(cur&&cur.d===todayKey()){
      const ns=cur.s.map(x=>x.slice()); const idx=+t.dataset.i;
      if(ns[idx]){ ns[idx][t.dataset.f==='w'?0:1] = +t.value||0; }
      h[h.length-1]=Object.assign({},cur,{s:ns}); L[nm]=h;
      await save('zece:lifts',L,'lifts'); render(); checkPR(nm);
    }
    return;
  }
  if(t.dataset && t.dataset.note){
    const w=S.workouts||{};
    const entries=(w.entries||[]).map(e=>e.eid===t.dataset.note?Object.assign({},e,{note:t.value}):e);
    await save('zece:workouts',Object.assign({},w,{entries}),'workouts');
  }
});

/* ---------- intro ---------- */
(function intro(){
  const el=document.getElementById('intro');
  const reduced=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const close=()=>{ if(!el.parentNode) return; el.classList.add('out'); setTimeout(()=>el.remove(),470); };
  setTimeout(close,reduced?600:2550);
  el.addEventListener('click',close);
})();

/* ---------- pornire ---------- */
(async function init(){
  render();
  const [t,g,l,w,wt,nu,kl,lf,cb,cc]=await Promise.all([store.get('zece:tests'),store.get('zece:gtg'),
    store.get('zece:wlog'),store.get('zece:workouts'),store.get('zece:weights'),
    store.get('zece:nutri'),store.get('zece:mlog'),store.get('zece:lifts'),
    store.get('zece:curBlock'),store.get('zece:cyc')]);
  const [bg,bgo]=await Promise.all([store.get('zece:bg'),store.get('zece:bgOp')]);
  if(bg) S.bgImg=bg; if(bgo) S.bgOp=bgo;
  if(typeof cb==='number') S.curBlock=cb; if(cc&&typeof cc==='object') S.cyc=cc;
  if(wt) S.weights=wt; if(nu) S.nutri=nu; if(kl) S.mlog=kl; if(lf) S.lifts=lf;
  if(Array.isArray(t)) S.tests=t;
  const [sh0,bd0]=await Promise.all([store.get('zece:shoes'),store.get('zece:body')]);
  if(Array.isArray(sh0)) S.shoes=sh0; if(bd0&&typeof bd0==='object') S.body=bd0;
  const [cn,bs,rs0]=await Promise.all([store.get('zece:counts'),store.get('zece:bgSound'),store.get('zece:rest')]);
  if(cn&&typeof cn==='object') S.counts=cn;
  if(bs===false) S.bgSound=false;
  if(rs0&&rs0.endAt>Date.now()) S.rest={endAt:rs0.endAt,total:rs0.total,label:rs0.label||'',beeped:99,bg:false};
  const [rp,rl]=await Promise.all([store.get('zece:runPlan'),store.get('zece:runs')]);
  if(rp&&typeof rp==='object') S.runPlan=rp;
  if(Array.isArray(rl)) S.runs=rl;
  if(g) S.gtg=g; if(l) S.wlog=l; if(w) S.workouts=w;
  const sv=await store.get('zece:sess'); if(sv&&sv.start) S.sess=sv;
  S.openDay=nextDay(activeBlock()).d;
  ensureDock(); paintDock();
  const last=latestFull();
  if(last&&last.pull) S.paceS=last.pull;
  { const t0=trend(); if(t0&&t0.last) S.paceM=Math.round(t0.last); }
  render();
})();
</script>
